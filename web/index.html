<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>md-agent</title>
<link rel="stylesheet" href="vendor/xterm.min.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; }
  /* 外壳：终端内容区 + DOM 输入条 + DOM 状态条（UI chrome 全部放 DOM，resize 由 CSS 自动适配） */
  #app { display: flex; flex-direction: column; height: 100%; }
  #terminal { flex: 1; min-height: 0; overflow: hidden; }
  /* 留白放在 .xterm 自身（FitAddon 会读 term.element 的 padding 并扣除，不会像父级 padding 那样算偏列数） */
  #terminal .xterm { padding: 10px; box-sizing: border-box; }

  /* xterm 滚动条：细窄 + 主题色（仅终端内滚动，页面永不滚动） */
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }
  .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #45475a; }
  .xterm-viewport { scrollbar-width: thin; scrollbar-color: #313244 transparent; }

  /* ---- DOM 输入条（原流内输入框迁出；上下边框包裹输入行，跟随滚动淡出）---- */
  #input-bar {
    background: #181825;
    transition: opacity .25s ease;
  }
  #quick-btns { display: flex; gap: 6px; padding: 6px 10px; }
  #quick-btns button {
    background: #313244; color: #a6adc8; border: none; border-radius: 5px;
    padding: 2px 10px; font-size: 12px; cursor: pointer; position: relative;
  }
  #quick-btns button:hover { background: #45475a; color: #cdd6f4; }
  #quick-btns button:disabled { opacity: .5; cursor: default; }
  /* 按钮徽标（待审红 / 审计黄，右上角；与状态行同源，updateBadges 8s 轮询更新） */
  #quick-btns .badge {
    position: absolute; top: -5px; right: -6px; min-width: 15px; height: 15px;
    padding: 0 4px; border-radius: 8px; box-sizing: border-box;
    background: #f38ba8; color: #11111b; font-size: 10px; font-weight: 700;
    line-height: 15px; text-align: center;
  }
  #quick-btns .badge.warn { background: #f9e2af; }
  /* 输入框上下两条全宽横线（定稿视觉：上边框 + 输入行 + 下边框） */
  /* 命令补全面板：悬浮在输入框上方（absolute 定位，不占布局） */

  /* ---- 速览侧边栏（批次三：Ctrl+K | /side | 快捷按钮唤出的左侧抽屉，非常驻；改造后=命令面板 + 状态中心）---- */
  #side-drawer {
    position: fixed; left: 10px; top: 10px; bottom: 10px; width: 320px;
    background: #181825; border: 1px solid #313244; border-radius: 8px;
    z-index: 50; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #side-drawer.hidden { display: none; }
  #side-drawer header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #313244; }
  #side-drawer header span { color: #f5e0dc; font-weight: 600; font-size: 13px; }
  #side-drawer header button { background: #313244; color: #cdd6f4; border: none; border-radius: 5px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  /* 命令面板（抽屉上部）：搜索框 + 候选列表；下半为状态中心速览卡 */
  #side-search-wrap { padding: 8px; border-bottom: 1px solid #313244; display: flex; flex-direction: column; gap: 6px; }
  #side-search { width: 100%; box-sizing: border-box; background: #1e1e30; color: #cdd6f4;
    border: 1px solid #313244; border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; }
  #side-search:focus { border-color: #89b4fa; }
  #side-results { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .side-result { padding: 4px 8px; border-radius: 5px; font-size: 12px; cursor: pointer;
    display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .side-result.sel { background: #313244; }
  .side-result .k { color: #89b4fa; flex: none; }
  .side-result .d { color: #7f849c; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  #side-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .side-sec { background: #1e1e30; border: 1px solid #313244; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .side-sec:hover { background: #232338; }
  .side-title { color: #89b4fa; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .side-body { color: #cdd6f4; font-size: 12px; line-height: 1.6; }
  .side-hint { color: #7f849c; font-size: 11px; margin-top: 3px; }

  /* ---- DOM 状态条（原流内状态行迁出；8s 轮询刷文本，不随终端滚动）---- */
  #status-dot.bad { background: #f38ba8; }
  /* /view 面板渲染层：iframe 沙箱浮层（图谱可视化等 HTML 视图） */
  #view-overlay {
    position: fixed; inset: 0; z-index: 100; background: #11111b;
    display: flex; flex-direction: column;
  }
  #view-overlay.hidden { display: none; }
  #view-overlay header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #181825; border-bottom: 1px solid #313244;
  }
  #view-overlay header span { color: #f5e0dc; font-weight: 600; font-size: 13px; }
  #view-overlay header button {
    background: #313244; color: #cdd6f4; border: none; border-radius: 6px;
    padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  #view-overlay header button:hover { background: #45475a; }
  /* /view 标签页：多视图并存（graph/board/pending/audit/html 可同时开、切换、关闭） */
  #view-tabs { display: flex; gap: 4px; align-items: center; flex: 1; min-width: 0; overflow-x: auto; }
  .view-tab {
    background: #313244; color: #a6adc8; border: none; border-radius: 5px;
    padding: 3px 8px 3px 10px; font-size: 12px; cursor: pointer;
    display: flex; gap: 5px; align-items: center; white-space: nowrap;
  }
  .view-tab.active { background: #45475a; color: #f5e0dc; }
  .view-tab.warn { color: #f9e2af; }  /* 加载慢（后台节流 10s 未就绪） */
  .view-tab.err { color: #f38ba8; }   /* 视图脚本错误（已上报宿主） */
  .view-tab .ld { width: 6px; height: 6px; border-radius: 50%; background: #89b4fa;
                  flex: none; animation: ld-pulse 1s ease-in-out infinite; }
  @keyframes ld-pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  .view-tab-x { color: #a6adc8; font-weight: 700; padding: 0 2px; border-radius: 3px; }
  .view-tab-x:hover { color: #f38ba8; background: #181825; }
  #view-panes { flex: 1; position: relative; min-height: 0; }
  #view-panes iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; }
  #view-panes iframe.active { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="terminal"></div>

  <!-- 快捷工具栏（DOM）：输入框/状态栏回流内终端流（贴内容末尾），按钮行保留；全导航语义 + 徽标计数 -->
  <div id="input-bar">
    <div id="quick-btns">
      <button data-cmd="/view graph" title="知识库结构导航（查看图谱）">图谱</button>
      <button data-cmd="/view pending" data-badge="pending" title="待审审核面板（批准/拒绝 LLM 写回；红徽标=待审数，点击直达）">待审</button>
      <button data-cmd="/view audit" data-badge="audit" title="知识库健康审计面板（黄徽标=审计发现数，点击直达）">审计</button>
      <button data-cmd="/view market" title="应用市场（SkillHub 管理端）">市场</button>
      <button data-cmd="/side" title="命令面板 + 速览（Ctrl+K）">速览</button>
    </div>
  </div>
</div>

<!-- /view 渲染层：iframe 沙箱（sandbox=allow-scripts，跨源桥接走 postMessage）；多标签并存 -->
<div id="view-overlay" class="hidden">
  <header>
    <div id="view-tabs"></div>
    <button id="view-close-all" title="关闭全部视图">全部关闭</button>
    <button id="view-close" title="关闭当前视图 (Esc)">× 关闭</button>
  </header>
  <div id="view-panes"></div>
</div>

<!-- 命令面板 + 状态中心（Ctrl+K / /side / 速览按钮唤出；上部模糊搜索直达视图/命令/@文档，下部实时速览卡） -->
<div id="side-drawer" class="hidden">
  <header>
    <span>命令面板</span>
    <button id="side-refresh" title="刷新">↻</button>
  </header>
  <div id="side-search-wrap">
    <input id="side-search" type="text" placeholder="搜索：视图 / 命令 / @文档（↑↓ 选择 · 回车执行 · Esc 关闭）" autocomplete="off" spellcheck="false">
    <div id="side-results"></div>
  </div>
  <div id="side-body"></div>
</div>

<script src="vendor/xterm.min.js"></script>
<script src="vendor/addon-fit.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
