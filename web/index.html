<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>md-agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; }
  /* 外壳：终端内容区 + DOM 输入条 + DOM 状态条（UI chrome 全部放 DOM，resize 由 CSS 自动适配） */
  #app { display: flex; flex-direction: column; height: 100%; }
  #terminal { flex: 1; min-height: 0; overflow: hidden; }
  /* 留白放在 .xterm 自身（FitAddon 会读 term.element 的 padding 并扣除，不会像父级 padding 那样算偏列数） */
  #terminal .xterm { padding: 10px; box-sizing: border-box; }

  /* xterm 滚动条：细窄 + 主题色（仅终端内滚动，页面永不滚动） */
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }
  .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #45475a; }
  .xterm-viewport { scrollbar-width: thin; scrollbar-color: #313244 transparent; }

  /* ---- DOM 输入条（原流内输入框迁出；边框用 CSS border 跟随宽度，resize 零变形）---- */
  #input-bar {
    border-top: 1px solid #313244;
    background: #181825;
    padding: 6px 10px;
  }
  #quick-btns { display: flex; gap: 6px; margin-bottom: 6px; }
  #quick-btns button {
    background: #313244; color: #a6adc8; border: none; border-radius: 5px;
    padding: 2px 10px; font-size: 12px; cursor: pointer;
  }
  #quick-btns button:hover { background: #45475a; color: #cdd6f4; }
  #quick-btns button:disabled { opacity: .5; cursor: default; }
  #input-wrap { position: relative; display: flex; align-items: flex-start; }
  #prompt-tag { color: #89b4fa; font-weight: 700; margin: 2px 8px 0 0; font-size: 14px; line-height: 20px; }
  #cmd-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #cdd6f4; font-size: 14px; font-family: Consolas, "Cascadia Mono", monospace;
    resize: none; line-height: 20px; padding: 0;
  }
  #cmd-input::placeholder { color: #6c7086; }
  #send-btn {
    background: #313244; color: #cdd6f4; border: none; border-radius: 5px;
    padding: 3px 12px; font-size: 13px; cursor: pointer; margin: 1px 0 0 8px;
  }
  #send-btn:hover { background: #45475a; }
  #send-btn:disabled { opacity: .5; cursor: default; }

  /* 命令补全面板：悬浮在输入框上方（absolute 定位，不占布局） */
  #autocomplete {
    position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 50;
    background: #181825; border: 1px solid #45475a; border-radius: 6px;
    max-height: 240px; overflow-y: auto; min-width: 280px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
  }
  #autocomplete.hidden { display: none; }
  #autocomplete .ac-item { padding: 5px 12px; font-size: 13px; color: #a6adc8; cursor: pointer; }
  #autocomplete .ac-item.sel { background: #313244; color: #cdd6f4; }
  #autocomplete .ac-desc { color: #6c7086; font-size: 11px; margin-left: 8px; }

  /* ---- DOM 状态条（原流内状态行迁出；8s 轮询刷文本，不随终端滚动）---- */
  #status-bar {
    display: flex; align-items: center; gap: 8px;
    background: #11111b; border-top: 1px solid #313244;
    padding: 4px 12px; font-size: 12px; color: #a6adc8;
    white-space: nowrap; overflow: hidden;
  }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #status-dot.ok { background: #a6e3a1; }
  #status-dot.bad { background: #f38ba8; }
  #status-text { overflow: hidden; text-overflow: ellipsis; }
  #status-warn { color: #f9e2af; flex: none; }

  /* /view 面板渲染层：iframe 沙箱浮层（图谱可视化等 HTML 视图） */
  #view-overlay {
    position: fixed; inset: 0; z-index: 100; background: #11111b;
    display: flex; flex-direction: column;
  }
  #view-overlay.hidden { display: none; }
  #view-overlay header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #181825; border-bottom: 1px solid #313244;
  }
  #view-overlay header span { color: #f5e0dc; font-weight: 600; font-size: 13px; }
  #view-overlay header button {
    background: #313244; color: #cdd6f4; border: none; border-radius: 6px;
    padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  #view-overlay header button:hover { background: #45475a; }
  #view-frame { flex: 1; border: none; width: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="terminal"></div>

  <!-- DOM 输入条：快捷按钮 + 输入框 + 补全面板（原流内输入框/状态行迁出终端流） -->
  <div id="input-bar">
    <div id="quick-btns">
      <button data-cmd="/sync" title="重建 INDEX.md（自动索引 L2）">同步</button>
      <button data-cmd="/rescan" title="重建知识图谱（SQLite）">图谱</button>
      <button data-cmd="/pending" title="查看待审（LLM 写回先进这里）">待审</button>
      <button data-cmd="/digest" title="检索知识库并整理成新笔记（进待审）">整理</button>
      <button data-cmd="/clear" title="清空多轮对话记忆">清记忆</button>
      <button data-cmd="/help" title="命令列表">帮助</button>
    </div>
    <div id="input-wrap">
      <span id="prompt-tag">❯</span>
      <textarea id="cmd-input" rows="1" spellcheck="false" placeholder="输入问题，或 /help 查看命令（Enter 提交，Shift+Enter 换行，↑↓ 翻历史，Tab 补全）"></textarea>
      <button id="send-btn">发送</button>
      <div id="autocomplete" class="hidden"></div>
    </div>
  </div>

  <!-- DOM 状态条：服务/模型/KB/待审/任务/图谱/心跳 + 审计警告 -->
  <div id="status-bar">
    <span id="status-dot" title="服务状态"></span>
    <span id="status-text">状态加载中…</span>
    <span id="status-warn" style="display:none"></span>
  </div>
</div>

<!-- /view 渲染层：iframe 沙箱（sandbox=allow-scripts，跨源桥接走 postMessage） -->
<div id="view-overlay" class="hidden">
  <header>
    <span id="view-title">视图</span>
    <button id="view-close" title="关闭视图 (Esc)">× 关闭</button>
  </header>
  <iframe id="view-frame" sandbox="allow-scripts"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
