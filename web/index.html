<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>md-agent</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; }
  body { color: #cdd6f4; font-family: ui-monospace, Consolas, "Microsoft YaHei", monospace; }

  /* ---- 整体三区：左侧会话边栏 + 主区（顶栏/消息流/输入条） ---- */
  #app { display: flex; height: 100%; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ---- 左侧会话边栏（DeepSeek 式：新建/搜索/恢复/归档） ---- */
  #sidebar { width: 300px; flex: none; background: #181825; border-right: 1px solid #313244;
    display: flex; flex-direction: column; }
  .sb-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #313244; }
  .sb-logo { font-weight: 700; letter-spacing: 1px; color: #89b4fa; font-size: 15px; }
  #session-new { background: #26263a; color: #a6e3a1; border: 1px dashed #313244;
    border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; flex: none; }
  #session-new:hover { border-color: #a6e3a1; }
  .sb-search-wrap { padding: 10px 12px 6px; }
  #sb-search { width: 100%; box-sizing: border-box; background: #1e1e30; color: #cdd6f4;
    border: 1px solid #313244; border-radius: 8px; padding: 7px 10px; font-size: 12px; outline: none; }
  #sb-search:focus { border-color: #89b4fa; }
  #sb-list { flex: 1; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px;
    scrollbar-width: thin; scrollbar-color: #313244 transparent; }
  .sb-group { color: #585b70; font-size: 11px; padding: 8px 6px 3px; }
  .sb-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .sb-item:hover { background: #26263a; }
  .sb-item.current { background: rgba(137, 180, 250, .1); }
  .sb-item.current .sb-item-title { color: #89b4fa; }
  .sb-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: #a6adc8; }
  .sb-item-meta { flex: none; font-size: 10.5px; color: #585b70; }
  .sb-item-x { flex: none; color: #585b70; font-weight: 700; padding: 0 3px; border-radius: 4px; visibility: hidden; }
  .sb-item:hover .sb-item-x { visibility: visible; }
  .sb-item-x:hover { color: #f38ba8; background: #181825; }
  .sb-empty { color: #585b70; font-size: 11.5px; padding: 12px 8px; text-align: center; }
  #sb-nav { flex: none; display: flex; gap: 4px; padding: 10px 12px; border-top: 1px solid #313244; }
  #sb-nav button { flex: 1; background: #26263a; color: #a6adc8; border: none; border-radius: 8px;
    padding: 7px 2px; font-size: 13px; cursor: pointer; position: relative; }
  #sb-nav button:hover { background: #313244; color: #cdd6f4; }
  #sb-nav button:disabled { opacity: .5; cursor: default; }
  #sb-nav .badge { position: absolute; top: -5px; right: -4px; min-width: 15px; height: 15px;
    padding: 0 4px; border-radius: 8px; box-sizing: border-box;
    background: #f38ba8; color: #11111b; font-size: 10px; font-weight: 700;
    line-height: 15px; text-align: center; }
  #sb-nav .badge.warn { background: #f9e2af; }

  /* ---- 顶栏（会话标题 + 模型芯片） ---- */
  #topbar { flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 52px; background: #181825; border-bottom: 1px solid #313244; gap: 12px; }
  #topbar-title { font-size: 14px; font-weight: 600; color: #cdd6f4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #model-chip { flex: none; background: #26263a; color: #a6adc8; border: 1px solid #313244;
    border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; max-width: 300px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #model-chip:hover { border-color: #89b4fa; color: #cdd6f4; }
  #model-chip.nok { color: #f38ba8; border-color: rgba(243, 139, 168, .4); }

  /* ---- 消息流（气泡容器，独立滚动，内容居中 820px） ---- */
  #stream { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 24px;
    display: flex; flex-direction: column;
    scrollbar-width: thin; scrollbar-color: #313244 transparent; }
  #stream::-webkit-scrollbar { width: 8px; }
  #stream::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }
  #stream > * { margin: 0 auto; max-width: 820px; }
  .row { margin-bottom: 8px; }

  /* 用户气泡（右对齐） */
  .msg.user { align-self: flex-end; margin-left: auto; margin-right: 0; width: auto;
    max-width: min(78%, 820px); background: rgba(137, 180, 250, .12);
    border: 1px solid rgba(137, 180, 250, .28); border-radius: 14px 14px 4px 14px;
    padding: 9px 14px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user .row { margin: 0; }
  /* 助手/工具消息（整宽左对齐文本块） */
  .msg.assistant, .msg.tool { width: 100%; margin-bottom: 14px; }
  .msg.assistant .stream-row:last-child, .msg.tool .stream-row:last-child { margin-bottom: 0; }

  /* 深度思考折叠块（DeepSeek 式：reasoning 折叠展示） */
  .think-card { margin: 2px 0 10px; }
  .think-block { border: 1px solid #313244; border-radius: 10px; overflow: hidden;
    background: rgba(49, 50, 68, .25); }
  .think-block .think-head { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    font-size: 12.5px; color: #7f849c; cursor: pointer; user-select: none; }
  .think-block .think-head:hover { color: #a6adc8; }
  .think-block .think-head .chev { margin-left: auto; transition: transform .15s ease; font-size: 11px; }
  .think-block.open .think-head .chev { transform: rotate(90deg); }
  .think-block .think-body { display: none; padding: 0 12px 10px; font-size: 12.5px; line-height: 1.7;
    color: #a6adc8; border-top: 1px solid rgba(49, 50, 68, .6); white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow-y: auto; }
  .think-block.open .think-body { display: block; padding-top: 8px; }

  /* 工具调用折叠卡（三态 + 点击展开） */
  .toolrow { margin: 2px 0; font-size: 12.5px; cursor: pointer; padding: 5px 12px; border-radius: 8px;
    background: #1e1e30; border: 1px solid #313244; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .toolrow:hover { border-color: #45475a; }
  .toolrow .tr-name { font-weight: 700; }
  .toolrow .tr-name .tr-ico { margin-right: 5px; }
  .toolrow.queued .tr-name { color: #7f849c; }
  .toolrow.running .tr-name { color: #f9e2af; }
  .toolrow.done .tr-name { color: #a6e3a1; }
  .toolrow.fail { border-color: rgba(243, 139, 168, .5); background: rgba(243, 139, 168, .07); }
  .toolrow.fail .tr-name { color: #f38ba8; }
  .toolrow .tr-state { color: #7f849c; font-size: 11.5px; margin-left: auto; }
  .toolrow.running .tr-state { color: #f9e2af; }
  .toolrow.done .tr-state { color: #a6e3a1; }
  .toolrow.fail .tr-state { color: #f38ba8; }
  .toolrow .tr-body { display: none; width: 100%; margin: 4px 0 2px 2px; font-size: 12px; color: #cdd6f4;
    white-space: pre-wrap; word-break: break-word; border-top: 1px dashed rgba(49, 50, 68, .8); padding-top: 6px; }
  .toolrow.open .tr-body { display: block; }
  .toolrow .tr-body .kv { color: #7f849c; }
  .toolrow .tr-body .res { color: #a6adc8; }

  /* 欢迎横幅（居中卡片 + 建议 chips） */
  .welcome { text-align: center; margin: 8vh auto 20px; max-width: 560px;
    background: linear-gradient(135deg, rgba(137, 180, 250, .07), transparent 60%);
    border: 1px solid rgba(137, 180, 250, .25); border-radius: 14px; padding: 22px 24px; }
  .welcome .w-title { font-size: 19px; font-weight: 700; letter-spacing: 3px; color: #89b4fa; margin-bottom: 8px; }
  .welcome .w-line { color: #a6adc8; font-size: 12.5px; line-height: 1.9; }
  .welcome .w-line .k { color: #89b4fa; font-weight: 700; }
  .welcome .dim { color: #585b70; font-size: 12px; }
  .w-chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 6px; }
  .w-chips button { background: #26263a; color: #a6adc8; border: 1px solid #313244; border-radius: 20px;
    padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .w-chips button:hover { border-color: #89b4fa; color: #cdd6f4; }
  .welcome .w-status { color: #585b70; font-size: 12px; margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed rgba(49, 50, 68, .7); }
  .welcome .w-status .v { color: #a6e3a1; }

  /* ---- 底部输入条（固定，DeepSeek 式大输入框 + 联网开关 + 发送/停止） ---- */
  #input-bar { flex: none; background: #181825; border-top: 1px solid #313244; padding: 10px 0 8px; }
  #input-bar .i-row { display: flex; align-items: flex-end; gap: 10px; max-width: 820px; margin: 0 auto; padding: 0 16px; }
  #cmd-input { flex: 1; min-height: 44px; max-height: 200px; background: #26263a; color: #cdd6f4;
    border: 1px solid #313244; border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 13.5px;
    resize: none; outline: none; caret-color: #89b4fa; line-height: 1.6; }
  #cmd-input:focus { border-color: #89b4fa; }
  #cmd-input::placeholder { color: #585b70; }
  #attach-btn { flex: none; width: 44px; height: 44px; border: 1px dashed #313244; background: transparent;
    color: #585b70; border-radius: 12px; font-size: 16px; cursor: not-allowed; }
  #send-btn { flex: none; height: 44px; padding: 0 22px; border: none; border-radius: 12px;
    background: #89b4fa; color: #11111b; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  #send-btn:hover { background: #9ac4ff; }
  #send-btn.stop { background: #f38ba8; color: #11111b; }
  #send-btn.stop:hover { background: #f5a3b5; }
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; margin: 0 0 12px 2px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; cursor: pointer; inset: 0; background: #313244; border-radius: 10px; transition: .2s; }
  .switch .slider:before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px;
    background: #a6adc8; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: rgba(137, 180, 250, .55); }
  .switch input:checked + .slider:before { transform: translateX(16px); background: #89b4fa; }
  #web-label { font-size: 12px; color: #7f849c; margin: 0 6px 12px 0; white-space: nowrap; }
  #statusline { max-width: 820px; margin: 6px auto 0; padding: 0 16px; color: #585b70; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- 补全下拉（锚定输入条上方，app.js 动态定位） ---- */
  #completion { position: fixed; z-index: 40; background: #181825;
    border: 1px solid #313244; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
    max-height: 220px; overflow-y: auto; display: none; min-width: 260px; }
  #completion.open { display: block; }
  .comp-item { padding: 5px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .comp-item.sel { background: #313244; color: #89b4fa; }

  /* ---- /view 面板渲染层（保留） ---- */
  #view-overlay { position: fixed; inset: 0; z-index: 100; background: #11111b;
    display: flex; flex-direction: column; }
  #view-overlay.hidden { display: none; }
  #view-overlay header { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #181825; border-bottom: 1px solid #313244; }
  #view-overlay header span { color: #f5e0dc; font-weight: 600; font-size: 13px; }
  #view-overlay header button { background: #313244; color: #cdd6f4; border: none; border-radius: 6px;
    padding: 4px 12px; font-size: 12px; cursor: pointer; }
  #view-overlay header button:hover { background: #45475a; }
  #view-tabs { display: flex; gap: 4px; align-items: center; flex: 1; min-width: 0; overflow-x: auto; }
  .view-tab { background: #313244; color: #a6adc8; border: none; border-radius: 5px;
    padding: 3px 8px 3px 10px; font-size: 12px; cursor: pointer;
    display: flex; gap: 5px; align-items: center; white-space: nowrap; }
  .view-tab.active { background: #45475a; color: #f5e0dc; }
  .view-tab.warn { color: #f9e2af; }
  .view-tab.err { color: #f38ba8; }
  .view-tab .ld { width: 6px; height: 6px; border-radius: 50%; background: #89b4fa;
    flex: none; animation: ld-pulse 1s ease-in-out infinite; }
  @keyframes ld-pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  .view-tab-x { color: #a6adc8; font-weight: 700; padding: 0 2px; border-radius: 3px; }
  .view-tab-x:hover { color: #f38ba8; background: #181825; }
  #view-panes { flex: 1; position: relative; min-height: 0; }
  #view-panes iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; }
  #view-panes iframe.active { display: block; }
  body.view-split #main { flex: 0 0 40%; width: 40%; }
  body.view-split #view-overlay { left: 40%; }

  /* ---- 速览侧边栏（移到右侧，避免与会话栏重叠） ---- */
  #side-drawer { position: fixed; right: 10px; top: 10px; bottom: 10px; width: 320px;
    background: #181825; border: 1px solid #313244; border-radius: 8px;
    z-index: 50; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #side-drawer.hidden { display: none; }
  #side-drawer header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #313244; }
  #side-drawer header span { color: #f5e0dc; font-weight: 600; font-size: 13px; }
  #side-drawer header button { background: #313244; color: #cdd6f4; border: none; border-radius: 5px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  #side-search-wrap { padding: 8px; border-bottom: 1px solid #313244; display: flex; flex-direction: column; gap: 6px; }
  #side-search { width: 100%; box-sizing: border-box; background: #1e1e30; color: #cdd6f4;
    border: 1px solid #313244; border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; }
  #side-search:focus { border-color: #89b4fa; }
  #side-results { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .side-result { padding: 4px 8px; border-radius: 5px; font-size: 12px; cursor: pointer;
    display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .side-result.sel { background: #313244; }
  .side-result .k { color: #89b4fa; flex: none; }
  .side-result .d { color: #7f849c; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  #side-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .side-sec { background: #1e1e30; border: 1px solid #313244; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .side-sec:hover { background: #232338; }
  .side-title { color: #89b4fa; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .side-body { color: #cdd6f4; font-size: 12px; line-height: 1.6; }
  .side-hint { color: #7f849c; font-size: 11px; margin-top: 3px; }
</style>
</head>
<body>
<div id="app">
  <!-- 左侧会话边栏（DeepSeek 式：新建/搜索/恢复/归档 + 底部导航） -->
  <aside id="sidebar">
    <div class="sb-head">
      <span class="sb-logo">md-agent</span>
      <button id="session-new" title="归档当前会话并开始新会话">＋ 新对话</button>
    </div>
    <div class="sb-search-wrap">
      <input id="sb-search" type="text" placeholder="搜索会话…" autocomplete="off" spellcheck="false">
    </div>
    <div id="sb-list"><div class="sb-empty">加载中…</div></div>
    <nav id="sb-nav">
      <button data-cmd="/view home" title="功能首页（全部功能一键进入）">🏠</button>
      <button data-cmd="/view graph" title="知识库结构导航（查看图谱）">🕸️</button>
      <button data-cmd="/view pending" data-badge="pending" title="待审审核面板">📥</button>
      <button data-cmd="/view audit" data-badge="audit" title="知识库健康审计面板">🩺</button>
      <button data-cmd="/view market" title="应用市场">🧩</button>
      <button data-cmd="/side" title="命令面板 + 速览（Ctrl+K）">⌘</button>
    </nav>
  </aside>

  <!-- 主区：顶栏 + 消息流 + 底部输入条 -->
  <main id="main">
    <header id="topbar">
      <div id="topbar-title">新对话</div>
      <button id="model-chip" title="点击打开配置页">…</button>
    </header>

    <div id="stream"></div>

    <div id="input-bar">
      <div class="i-row">
        <button id="attach-btn" title="上传文档（即将支持）" disabled>＋</button>
        <label class="switch" title="联网搜索（服务端 web_search，非流式）"><input type="checkbox" id="web-toggle"><span class="slider"></span></label>
        <span id="web-label">联网</span>
        <textarea id="cmd-input" rows="1" placeholder="输入问题 / 命令（Tab 补全 · @ 提及 · /view 面板）" autocomplete="off" spellcheck="false"></textarea>
        <button id="send-btn" title="发送 (Enter)">发送</button>
      </div>
      <div id="statusline"></div>
    </div>
  </main>
</div>

<!-- 补全下拉（锚定输入条上方） -->
<div id="completion"></div>

<!-- /view 渲染层（保留） -->
<div id="view-overlay" class="hidden">
  <header>
    <div id="view-tabs"></div>
    <button id="view-split" title="切换分屏">分屏</button>
    <button id="view-close-all" title="关闭全部视图">全部关闭</button>
    <button id="view-close" title="关闭当前视图 (Esc)">× 关闭</button>
  </header>
  <div id="view-panes"></div>
</div>

<!-- 命令面板 + 状态中心（保留，右侧抽屉） -->
<div id="side-drawer" class="hidden">
  <header>
    <span>命令面板</span>
    <button id="side-refresh" title="刷新">↻</button>
  </header>
  <div id="side-search-wrap">
    <input id="side-search" type="text" placeholder="搜索：视图 / 命令 / @文档（↑↓ 选择 · 回车执行 · Esc 关闭）" autocomplete="off" spellcheck="false">
    <div id="side-results"></div>
  </div>
  <div id="side-body"></div>
</div>

<script src="stream.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
