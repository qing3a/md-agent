<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>md-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script>
  // 主题初始化（防闪烁）：localStorage 优先，无则跟随系统；豆包同款 data-theme 机制
  (function () {
    var t = null;
    try { t = localStorage.getItem('md-agent-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { color: var(--fg); font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Microsoft YaHei", sans-serif; }

  /* ---- 整体三区：左侧会话边栏 + 主区（顶栏/消息流/输入条 + 内嵌详情页） ---- */
  #app { display: flex; height: 100%; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

  /* ---- 左侧边栏（豆包式：菜单上半 + 会话列表下半 + 底部） ---- */
  #sidebar { width: 300px; flex: none; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; }
  .sb-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sb-logo { font-weight: 700; letter-spacing: 1px; color: var(--accent); font-size: 15px; }
  #session-new { background: var(--chip); color: var(--ok); border: 1px dashed var(--border2);
    border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; flex: none; }
  #session-new:hover { border-color: var(--ok); }
  .sb-search-wrap { padding: 10px 12px 6px; }
  #sb-search { width: 100%; box-sizing: border-box; background: var(--chip2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12px; outline: none; }
  #sb-search:focus { border-color: var(--accent); }

  /* 功能菜单（上半：分组菜单项，点击在右侧详情页展示） */
  #sb-menu { flex: none; max-height: 42%; overflow-y: auto; padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 1px;
    border-bottom: 1px solid var(--border); scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #sb-menu .sb-group { color: var(--muted2); font-size: 11px; padding: 8px 6px 3px; }
  #sb-menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; color: var(--fg2); border: none; border-radius: 8px;
    padding: 9px 10px; font-size: 13.5px; cursor: pointer; position: relative; font-family: inherit; }
  #sb-menu button:hover { background: var(--hover); color: var(--fg); }
  #sb-menu button.active { background: var(--accent-10); color: var(--accent); }
  #sb-menu button.sb-new { color: var(--ok); font-weight: 600; }
  #sb-menu button.sb-new:hover { background: var(--ok-12); color: var(--ok); }
  #sb-menu .mi-ico { width: 20px; text-align: center; font-size: 15px; flex: none; }
  #sb-menu .badge { position: absolute; top: 4px; right: 8px; min-width: 15px; height: 15px;
    padding: 0 4px; border-radius: 8px; box-sizing: border-box;
    background: var(--danger); color: var(--bg3); font-size: 10px; font-weight: 700;
    line-height: 15px; text-align: center; }
  #sb-menu .badge.warn { background: var(--warn); }

  /* 会话列表（下半） */
  #sb-list { flex: 1; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #sb-list .sb-group { color: var(--muted2); font-size: 11px; padding: 8px 6px 3px; }
  .sb-item { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer; position: relative; }
  .sb-item:hover { background: var(--hover); }
  .sb-item.current { background: var(--accent-10); }
  .sb-item.current .sb-item-title { color: var(--accent); }
  .sb-item.sb-project-new { color: var(--muted2); font-size: 12px; justify-content: center;
    border: 1px dashed var(--border2); margin-top: 6px; }
  .sb-item.sb-project-new:hover { border-color: var(--accent); color: var(--accent); }
  /* 项目组头（会话归属项目）：点击 = 在该项目开新会话 */
  .sb-proj-head { cursor: pointer; border-radius: 6px; padding: 4px 6px; color: var(--muted); }
  .sb-proj-head:hover { background: var(--chip2); color: var(--fg); }
  .sb-proj-head.cur { color: var(--accent); font-weight: 700; }
  /* AI 处理中运行指示（会话行运行点 / 首问顶部指示条） */
  .sb-item.running { background: var(--accent-10); }
  .run-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    animation: runPulse 1s ease-in-out infinite; }
  @keyframes runPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }
  .sb-running { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px;
    background: var(--accent-10); color: var(--accent); font-size: 12px; margin-bottom: 4px; }
  .sb-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--fg2); }
  .sb-item-meta { flex: none; font-size: 10.5px; color: var(--muted2); }
  .sb-item-x { flex: none; color: var(--muted); font-weight: 700; padding: 0 3px; border-radius: 4px; visibility: hidden; }
  .sb-item:hover .sb-item-x { visibility: visible; }
  .sb-item-x:hover { color: var(--danger); background: var(--bg2); }
  .sb-item-more { flex: none; color: var(--muted); font-weight: 700; padding: 0 4px; border-radius: 4px; visibility: hidden; font-size: 13px; line-height: 1; }
  .sb-item:hover .sb-item-more { visibility: visible; }
  .sb-item-more:hover { color: var(--accent); background: var(--bg2); }
  .sb-item-del { flex: none; color: var(--muted); padding: 0 3px; border-radius: 4px; visibility: hidden; font-size: 11px; line-height: 1; }
  .sb-item:hover .sb-item-del { visibility: visible; }
  .sb-item-del:hover { color: var(--danger); background: var(--bg2); }
  .sb-empty { color: var(--muted); font-size: 11.5px; padding: 12px 8px; text-align: center; }

  /* 底部（配置/版本） */
  #sb-foot { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); }
  #sb-foot button { flex: 1; background: var(--chip); color: var(--fg2); border: none; border-radius: 8px;
    padding: 6px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  #sb-foot button:hover { background: var(--hover2); color: var(--fg); }
  #sb-foot .sb-ver { color: var(--muted2); font-size: 10.5px; flex: none; }

  /* ---- 顶栏（会话标题 + 主题切换 + 模型芯片） ---- */
  #topbar { flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 52px; background: var(--bg2); border-bottom: 1px solid var(--border); gap: 12px; }
  #topbar-title { font-size: 14px; font-weight: 600; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #topbar-right { display: flex; align-items: center; gap: 8px; flex: none; }
  #theme-btn { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 50%;
    background: var(--chip); color: var(--fg2); font-size: 14px; cursor: pointer; line-height: 1; }
  #theme-btn:hover { border-color: var(--accent); color: var(--fg); }
  #model-chip { flex: none; background: var(--chip); color: var(--fg2); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; max-width: 300px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #model-chip:hover { border-color: var(--accent); color: var(--fg); }
  #model-chip.nok { color: var(--danger); border-color: var(--danger-40); }
  /* 项目切换器：顶栏 chip + 下拉菜单（项目制：每个项目独立知识空间，硬隔离） */
  #project-chip { flex: none; background: var(--chip); color: var(--fg2); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #project-chip:hover { border-color: var(--accent); color: var(--fg); }
  #project-menu { position: fixed; z-index: 300; min-width: 260px; max-width: 320px;
    background: var(--bg2, #1e1e2e); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); padding: 6px; font-size: 12.5px; }
  #project-menu[hidden] { display: none; }
  #pm-head { color: var(--muted2); font-size: 11px; padding: 6px 10px 4px; letter-spacing: .03em; }
  #pm-list { max-height: 320px; overflow-y: auto; }
  #pm-list button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 8px 10px; border: none; background: none; color: var(--fg2); border-radius: 8px; cursor: pointer; }
  #pm-list button:hover { background: var(--hover); color: var(--fg); }
  #pm-list button.active { background: var(--accent-10); color: var(--accent); }
  #pm-list .pm-ico { width: 20px; text-align: center; flex: none; font-size: 14px; }
  #pm-list .pm-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pm-list .pm-tag { color: var(--muted2); font-size: 10.5px; flex: none; }
  #pm-new { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 4px;
    padding: 8px 10px; border: none; background: var(--chip); color: var(--ok); border-radius: 8px;
    cursor: pointer; font-weight: 600; }
  #pm-new:hover { background: var(--ok-12); }
  #pm-msg { color: var(--muted2); padding: 8px 10px; font-size: 11.5px; }
  /* 新建项目向导（模板三卡 + 命名 modal） */
  #npw-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; }
  #npw-overlay[hidden] { display: none; }
  #npw-box { background: var(--bg2, #1e1e2e); border: 1px solid var(--border); border-radius: 14px;
    width: 480px; max-width: 92vw; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  #npw-box h3 { margin: 0 0 12px; font-size: 15px; color: var(--fg); }
  .npw-tpls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .npw-tpl { border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer;
    background: var(--chip); text-align: center; transition: border-color .15s, background .15s; }
  .npw-tpl:hover { border-color: var(--accent); }
  .npw-tpl.sel { border-color: var(--accent); background: var(--accent-10); }
  .npw-tpl .ti { font-size: 22px; }
  .npw-tpl .tn { font-weight: 600; margin-top: 4px; color: var(--fg); }
  .npw-tpl .td { font-size: 10.5px; color: var(--muted2); margin-top: 2px; line-height: 1.45; }
  #npw-name { width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--chip); color: var(--fg); font-size: 13px; }
  #npw-name:focus { outline: none; border-color: var(--accent); }
  #npw-tip { font-size: 11px; color: var(--muted2); margin: 6px 0 12px; }
  .npw-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .npw-actions button { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--chip); color: var(--fg2); cursor: pointer; font-size: 12.5px; }
  .npw-actions button:hover { border-color: var(--accent); color: var(--fg); }
  #npw-create { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #npw-create:hover { color: #fff; }
  /* 命令参数弹窗（prefill 界面化：点卡片 → 弹参 → 直接执行，不再预填命令到输入框） */
  #pp-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; }
  #pp-overlay[hidden], #cf-overlay[hidden] { display: none; }
  #pp-box, #cf-box { background: var(--bg2, #1e1e2e); border: 1px solid var(--border); border-radius: 14px;
    width: 440px; max-width: 90vw; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  #pp-box h3, #cf-box h3 { margin: 0 0 4px; font-size: 15px; color: var(--fg); }
  #pp-desc { font-size: 12px; color: var(--muted2); margin-bottom: 12px; }
  #cf-msg { font-size: 13px; color: var(--fg); line-height: 1.7; }
  #cf-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; }
  #cf-ok.danger { background: var(--danger, #f38ba8); color: #fff; border-color: var(--danger, #f38ba8); font-weight: 600; }
  #cf-ok.danger:hover { color: #fff; }
  #pp-input { width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--chip); color: var(--fg); font-size: 13px; }
  #pp-input:focus { outline: none; border-color: var(--accent); }
  .pp-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .pp-actions button { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--chip); color: var(--fg2); cursor: pointer; font-size: 12.5px; }
  .pp-actions button:hover { border-color: var(--accent); color: var(--fg); }
  #pp-run { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #pp-run:hover { color: #fff; }

  /* ---- 消息流（气泡容器，独立滚动，内容居中 820px） ---- */
  #stream { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 24px;
    display: flex; flex-direction: column;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #stream::-webkit-scrollbar { width: 8px; }
  #stream::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #stream > * { margin: 0 auto; max-width: 820px; }
  .row { margin-bottom: 8px; }

  /* 用户气泡（右对齐） */
  .msg.user { align-self: flex-end; margin-left: auto; margin-right: 0; width: auto;
    max-width: min(78%, 820px); background: var(--accent-12);
    border: 1px solid var(--accent-28); border-radius: 14px 14px 4px 14px;
    padding: 9px 14px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user .row { margin: 0; }
  /* 助手/工具消息（整宽左对齐文本块） */
  .msg.assistant, .msg.tool { width: 100%; margin-bottom: 14px; }
  .msg.assistant .stream-row:last-child, .msg.tool .stream-row:last-child { margin-bottom: 0; }
  /* 回答内引用 [文件:行号] → 可点击跳图谱 */
  .ref-link { color: var(--accent); cursor: pointer; border-bottom: 1px dashed var(--accent-40, rgba(137,180,250,.4)); }
  .ref-link:hover { background: var(--accent-10); }

  /* 深度思考折叠块（DeepSeek 式：reasoning 折叠展示） */
  .think-card { margin: 2px 0 10px; }
  .think-block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    background: var(--chip2); }
  .think-block .think-head { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .think-block .think-head:hover { color: var(--fg2); }
  .think-block .think-head .chev { margin-left: auto; transition: transform .15s ease; font-size: 11px; }
  .think-block.open .think-head .chev { transform: rotate(90deg); }
  .think-block .think-body { display: none; padding: 0 12px 10px; font-size: 12.5px; line-height: 1.7;
    color: var(--fg2); border-top: 1px solid var(--border); white-space: pre-wrap; word-break: break-word;
    max-height: 320px; overflow-y: auto; }
  .think-block.open .think-body { display: block; padding-top: 8px; }

  /* 工具调用折叠卡（三态 + 点击展开） */
  .toolrow { margin: 2px 0; font-size: 12.5px; cursor: pointer; padding: 5px 12px; border-radius: 8px;
    background: var(--chip); border: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .toolrow:hover { border-color: var(--border2); }
  .toolrow .tr-name { font-weight: 700; }
  .toolrow .tr-name .tr-ico { margin-right: 5px; }
  .toolrow.queued .tr-name { color: var(--muted); }
  .toolrow.running .tr-name { color: var(--warn); }
  .toolrow.done .tr-name { color: var(--ok); }
  .toolrow.fail { border-color: var(--danger-50); background: var(--danger-07); }
  .toolrow.fail .tr-name { color: var(--danger); }
  .toolrow .tr-state { color: var(--muted); font-size: 11.5px; margin-left: auto; }
  .toolrow.running .tr-state { color: var(--warn); }
  .toolrow.done .tr-state { color: var(--ok); }
  .toolrow.fail .tr-state { color: var(--danger); }
  .toolrow .tr-body { display: none; width: 100%; margin: 4px 0 2px 2px; font-size: 12px; color: var(--fg);
    white-space: pre-wrap; word-break: break-word; border-top: 1px dashed var(--border); padding-top: 6px; }
  .toolrow.open .tr-body { display: block; }
  .toolrow .tr-body .kv { color: var(--muted); }
  .toolrow .tr-body .res { color: var(--fg2); }

  /* 交互卡片（对话流内旁路富展示：风控/待审等，按钮走 #stream 委托） */
  .card { margin: 2px 0 0; font-size: 12.5px; padding: 8px 12px 10px; border-radius: 8px;
    background: var(--chip); border: 1px solid var(--border); }
  .card .c-head { font-weight: 700; color: var(--fg); margin-bottom: 6px; }
  .card .c-rows { display: flex; flex-direction: column; gap: 4px; }
  .card .card-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .card .c-k { flex: none; font-size: 11px; padding: 1px 6px; border-radius: 5px; color: var(--fg2);
    background: var(--chip2); border: 1px solid var(--border); }
  .card .c-k-deadline { color: var(--danger); border-color: var(--danger-50); background: var(--danger-07); }
  .card .c-k-evidence { color: var(--warn); border-color: var(--warn); background: transparent; }
  .card .c-k-info { color: var(--info); border-color: var(--info); background: transparent; }
  .card .c-txt { flex: 1; min-width: 0; color: var(--fg); word-break: break-word; }
  .card .c-bad { flex: none; font-size: 11px; padding: 1px 6px; border-radius: 5px; color: var(--fg2); background: var(--chip2); }
  .card .c-bad-red { color: var(--danger); border: 1px solid var(--danger-50); background: var(--danger-07); }
  .card .c-bad-orange { color: var(--warn); border: 1px solid var(--warn); }
  .card .c-bad-yellow { color: var(--peach); border: 1px solid var(--peach); }
  .card .c-btn { flex: none; font-size: 11.5px; padding: 2px 10px; border-radius: 6px; cursor: pointer;
    color: var(--accent); background: var(--accent-10); border: 1px solid var(--accent-25); }
  .card .c-btn:hover { background: var(--accent-25); }
  .card .c-btn:disabled { opacity: .5; cursor: default; }
  .card .c-btn-ok { color: var(--ok); background: var(--ok-12); border-color: var(--ok); }
  .card .c-btn-ok:hover { background: var(--ok); color: var(--bg); }
  .card .c-btn-danger { color: var(--danger); background: var(--danger-07); border-color: var(--danger-50); }
  .card .c-btn-danger:hover { background: var(--danger); color: var(--bg); }
  .card .c-empty { color: var(--ok); padding: 2px 0; }
  .card .c-prev { margin-top: 4px; }
  .card .c-prev-in { border-top: 1px dashed var(--border); padding: 6px 2px 2px; font-size: 12px; color: var(--fg2); }
  .card .c-prev-t { color: var(--muted); margin-bottom: 4px; }
  .card .c-prev-in pre { margin: 0; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto;
    font-size: 11.5px; color: var(--fg2); }
  .card .c-fb-ok { color: var(--ok); font-size: 12px; padding: 4px 0 0; }

  /* 欢迎横幅（DeepSeek 式：简洁居中空状态） */
  .welcome { text-align: center; margin: 10vh auto 20px; max-width: 560px; }
  .welcome .w-hello { font-size: 24px; font-weight: 600; color: var(--fg); }

  /* ---- 底部输入条（固定，豆包式大输入框 + 联网开关 + 发送/停止） ---- */
  #input-bar { flex: none; background: var(--bg2); border-top: 1px solid var(--border); padding: 10px 0 8px; }
  #input-bar .i-row { display: flex; align-items: flex-end; gap: 10px; max-width: 820px; margin: 0 auto; padding: 0 16px; }
  #cmd-input { flex: 1; min-height: 44px; max-height: 200px; background: var(--input-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 13.5px;
    resize: none; outline: none; caret-color: var(--accent); line-height: 1.6; }
  #cmd-input:focus { border-color: var(--accent); }
  #cmd-input::placeholder { color: var(--muted); }
  #attach-btn { flex: none; width: 44px; height: 44px; border: 1px dashed var(--border2); background: transparent;
    color: var(--muted); border-radius: 12px; font-size: 16px; cursor: not-allowed; }
  #send-btn { flex: none; height: 44px; padding: 0 22px; border: none; border-radius: 12px;
    background: var(--accent); color: var(--bg3); font-weight: 700; font-size: 13.5px; cursor: pointer; }
  #send-btn:hover { background: var(--accent-strong); }
  #send-btn.stop { background: var(--danger); color: var(--bg3); }
  #send-btn.stop:hover { background: var(--danger); opacity: .9; }
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; margin: 0 0 12px 2px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; cursor: pointer; inset: 0; background: var(--border2); border-radius: 10px; transition: .2s; }
  .switch .slider:before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px;
    background: var(--fg2); border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--accent-55); }
  .switch input:checked + .slider:before { transform: translateX(16px); background: var(--accent); }
  #web-label { font-size: 12px; color: var(--muted); margin: 0 6px 12px 0; white-space: nowrap; }
  #statusline { max-width: 820px; margin: 6px auto 0; padding: 0 16px; color: var(--muted); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- 补全下拉（锚定输入条上方，app.js 动态定位） ---- */
  #completion { position: fixed; z-index: 40; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
    max-height: 220px; overflow-y: auto; display: none; min-width: 260px; }
  #completion.open { display: block; }
  .comp-item { padding: 5px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .comp-item.sel { background: var(--hover); color: var(--accent); }

  /* ---- /view 详情页（内嵌 #main：覆盖聊天区为右侧详情页；分屏时左聊天右面板；单视图） ---- */
  #view-overlay { position: absolute; inset: 0; z-index: 30; background: var(--bg);
    display: flex; flex-direction: column; }
  #view-overlay.hidden { display: none; }
  #view-overlay header { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  #view-title { color: var(--rose); font-weight: 600; font-size: 13px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #view-overlay header button { background: var(--chip); color: var(--fg); border: none; border-radius: 6px;
    padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  #view-overlay header button:hover { background: var(--hover2); }
  #view-panes { flex: 1; position: relative; min-height: 0; }
  #view-panes iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  body.view-split #view-overlay { left: 60%; }

  /* ---- 速览侧边栏（右侧抽屉） ---- */
  #side-drawer { position: fixed; right: 10px; top: 10px; bottom: 10px; width: 320px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    z-index: 50; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #side-drawer.hidden { display: none; }
  #side-drawer header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #side-drawer header span { color: var(--rose); font-weight: 600; font-size: 13px; }
  #side-drawer header button { background: var(--chip); color: var(--fg); border: none; border-radius: 5px; padding: 2px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  #side-search-wrap { padding: 8px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  #side-search { width: 100%; box-sizing: border-box; background: var(--chip2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; font-family: inherit; }
  #side-search:focus { border-color: var(--accent); }
  #side-results { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .side-result { padding: 4px 8px; border-radius: 5px; font-size: 12px; cursor: pointer;
    display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .side-result.sel { background: var(--hover); }
  .side-result .k { color: var(--accent); flex: none; }
  .side-result .d { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  #side-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .side-sec { background: var(--chip2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .side-sec:hover { background: var(--hover); }
  .side-title { color: var(--accent); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .side-body { color: var(--fg); font-size: 12px; line-height: 1.6; }
  .side-hint { color: var(--muted); font-size: 11px; margin-top: 3px; }

  /* ================================================================
   *  V2 升级：DeepSeek/豆包 风格 — 微交互动画 / 玻璃拟态 / 渐变 / 入场动效
   * ================================================================ */

  /* ---- 全局平滑过渡 ---- */
  * { transition-property: background-color, border-color, color, opacity, box-shadow, transform; transition-duration: .15s; }
  ::selection { background: var(--accent-25); color: var(--fg); }

  /* ---- 更精致的滚动条 ---- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border2); }

  /* ---- 消息入场动画 ---- */
  @keyframes msgSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes msgFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .msg.user, .msg.assistant, .msg.tool, .row, .toolrow, .card, .think-card {
    animation: msgSlideIn .3s ease-out both;
  }
  .msg.assistant .stream-row, .msg.tool .stream-row {
    animation: msgFadeIn .25s ease-out both;
  }
  /* 流式光标 */
  @keyframes blinkCursor { 0%,100%{opacity:1} 50%{opacity:0} }
  .streaming-cursor::after {
    content: '▊'; display: inline; animation: blinkCursor .8s step-end infinite;
    color: var(--accent); font-size: inherit; margin-left: 1px;
  }

  /* ---- 欢迎区 V2（简洁版：纯文字，无卡片背景） ---- */
  .welcome {
    background: transparent;
  }

  /* ---- 顶栏 V2 ---- */
  #topbar {
    position: relative; background: var(--glass-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--glass-border);
  }
  #topbar::after {
    content: ''; position: absolute; bottom: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-25), transparent);
  }
  #topbar-title { font-size: 14px; }
  #theme-btn { transition: transform .2s, border-color .2s, box-shadow .2s; }
  #theme-btn:hover { transform: scale(1.1); box-shadow: 0 0 12px var(--accent-12); }
  #model-chip, #project-chip {
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  #model-chip:hover, #project-chip:hover {
    border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-08);
  }

  /* ---- 输入条 V3（DeepSeek 风格：大圆角容器 + 内嵌底部工具栏） ---- */
  #input-bar {
    background: transparent;
    border-top: none;
    padding: 8px 20px 16px;
  }
  #ds-input-wrap {
    max-width: 820px; margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--input-bg);
    box-shadow: var(--shadow-sm);
    transition: border-color .2s, box-shadow .2s;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  #ds-input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-10), var(--shadow-md);
  }
  /* 项目入口（输入框顶部左：DeepSeek 风格） */
  .ds-project-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 0;
  }
  .ds-project-entry {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 6px; border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--chip2); color: var(--fg2);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; font-family: inherit;
    max-width: 260px;
  }
  .ds-project-entry:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-08);
  }
  .ds-project-entry .ds-pe-ico { font-size: 14px; flex: none; }
  .ds-project-entry .ds-pe-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .ds-project-entry .ds-pe-arrow {
    font-size: 10px; color: var(--muted); transition: transform .15s;
  }
  .ds-project-entry.active .ds-pe-arrow { transform: rotate(180deg); }
  /* 项目入口右侧信息 */
  .ds-project-info {
    font-size: 11px; color: var(--muted);
  }
  #cmd-input {
    width: 100%; box-sizing: border-box;
    border: none; background: transparent;
    border-radius: 0;
    padding: 4px 20px 4px;
    font-size: 15px; line-height: 1.6;
    min-height: 48px; max-height: 200px;
    resize: none; outline: none;
    color: var(--fg);
    font-family: inherit;
  }
  #cmd-input::placeholder { color: var(--muted); font-size: 14px; }
  .ds-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px 12px;
  }
  .ds-toolbar-left { display: flex; align-items: center; gap: 8px; }
  .ds-toolbar-right { display: flex; align-items: center; gap: 8px; }
  .ds-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 16px;
    border: 1px solid var(--border);
    background: transparent; color: var(--fg2);
    font-size: 12.5px; cursor: pointer;
    transition: all .15s; font-family: inherit;
    user-select: none;
  }
  .ds-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .ds-toggle.active {
    background: var(--accent-10);
    border-color: var(--accent-55);
    color: var(--accent);
  }
  .ds-toggle .ds-ico { font-size: 13px; }
  .ds-icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent; color: var(--fg2);
    font-size: 15px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .ds-icon-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-08);
  }
  #send-btn {
    width: 34px; height: 34px; padding: 0; border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 700; font-size: 15px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s, box-shadow .2s, opacity .15s;
  }
  #send-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 14px var(--accent-25);
  }
  #send-btn:active { transform: scale(0.92); }
  #send-btn:disabled { opacity: .5; cursor: not-allowed; }
  #send-btn.stop { background: var(--danger); }
  #send-btn.stop:hover { box-shadow: 0 4px 14px var(--danger-40); }
  .ds-web-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer; font-size: 12px; color: var(--muted);
    user-select: none;
  }
  .ds-web-toggle input { display: none; }
  .ds-web-toggle .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border2); transition: background .2s;
  }
  .ds-web-toggle input:checked ~ .dot { background: var(--accent); }
  .ds-web-toggle input:checked ~ .lbl { color: var(--accent); }
  /* reset old input-bar styles that conflict */
  #input-bar .i-row { display: none; }
  .switch { display: none; }
  #web-label { display: none; }
  #statusline { display: none; }

  /* ---- 消息气泡 V2 ---- */
  .msg.user {
    box-shadow: var(--shadow-sm);
    transition: box-shadow .2s, transform .15s;
  }
  .msg.user:hover { box-shadow: var(--shadow-md); }
  .msg.assistant { line-height: 1.75; }
  .msg.assistant p { margin: .6em 0; }
  .msg.assistant p:first-child { margin-top: 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }

  /* ---- 深度思考块 V2 ---- */
  .think-block { transition: border-color .2s, box-shadow .2s; }
  .think-block:hover { border-color: var(--accent-25); box-shadow: var(--shadow-sm); }
  .think-block .think-head { transition: color .2s; }
  .think-block .think-head .chev { transition: transform .2s cubic-bezier(.4,0,.2,1); }

  /* ---- 工具调用卡 V2 ---- */
  .toolrow { transition: border-color .2s, box-shadow .2s, background .2s; }
  .toolrow:hover { box-shadow: var(--shadow-sm); }
  .toolrow.open { border-color: var(--accent-25); }
  .toolrow .tr-body { transition: max-height .25s ease; }

  /* ---- 侧栏 V2 ---- */
  #sidebar { border-right: 1px solid var(--glass-border); }
  .sb-head { padding: 14px 16px 12px; }
  .sb-logo { font-size: 16px; letter-spacing: 2px; }
  #session-new {
    transition: border-color .2s, background .2s, transform .15s;
  }
  #session-new:hover { background: var(--ok-12); transform: translateY(-1px); }
  .sb-item { position: relative; }
  .sb-item.current::before {
    content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 50%; border-radius: 0 3px 3px 0;
    background: var(--accent-gradient);
  }
  .sb-item.current { background: var(--accent-10); }
  .sb-item-title { font-size: 12.5px; }
  .sb-item:hover { background: var(--hover); }
  #sb-menu button { transition: background .15s, color .15s; }
  #sb-menu button.active {
    background: var(--accent-10);
    box-shadow: inset 2px 0 0 var(--accent);
  }

  /* ---- 运行指示动画 ---- */
  @keyframes runPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
  .run-dot {
    box-shadow: 0 0 6px var(--accent-25);
  }

  /* ---- 面板 / 弹窗 V2 ---- */
  #project-menu, #npw-box, #pp-box, #cf-box, #completion, #side-drawer {
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    background: var(--glass-bg);
    box-shadow: var(--glass-shadow);
    border: 1px solid var(--glass-border);
  }
  #npw-overlay, #pp-overlay, #cf-overlay {
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    background: rgba(0,0,0,.35);
  }
  .npw-tpl { transition: border-color .2s, background .2s, transform .15s, box-shadow .2s; }
  .npw-tpl:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .npw-tpl.sel { border-color: var(--accent); background: var(--accent-10); box-shadow: 0 0 0 2px var(--accent-12); }
  .npw-actions button, .pp-actions button {
    transition: all .15s;
  }
  .npw-actions button:hover, .pp-actions button:hover {
    transform: translateY(-1px); box-shadow: var(--shadow-sm);
  }
  #npw-create, #pp-run {
    background: var(--accent-gradient);
    color: #fff; border: none;
  }
  #npw-create:hover, #pp-run:hover {
    opacity: .92; box-shadow: 0 4px 14px var(--accent-25);
  }
  #npw-name:focus, #pp-input:focus, #sb-search:focus, #side-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-12);
  }

  /* ---- 项目菜单 V2 ---- */
  #pm-list button { transition: background .15s; }
  #pm-list button:hover { background: var(--hover); }
  #pm-list button.active { background: var(--accent-10); }
  #pm-new { transition: background .15s, transform .15s; }
  #pm-new:hover { transform: translateY(-1px); }

  /* ---- 速览侧边栏 V2 ---- */
  #side-drawer { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: var(--glass-bg); }
  .side-sec { transition: border-color .2s, box-shadow .2s, transform .15s; }
  .side-sec:hover { border-color: var(--accent-25); transform: translateX(2px); box-shadow: var(--shadow-sm); }

  /* ---- 补全下拉 ---- */
  #completion { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: var(--glass-bg); }
  .comp-item { transition: background .1s; }
  .comp-item.sel { background: var(--accent-10); }

  /* ---- 卡片交互 V2 ---- */
  .card { transition: border-color .2s, box-shadow .2s; }
  .card:hover { border-color: var(--accent-25); box-shadow: var(--shadow-sm); }
  .card .c-btn { transition: all .15s; }
  .card .c-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px var(--accent-12); }
  .card .c-btn:active { transform: translateY(0); }

  /* ---- 空状态 / 加载 ---- */
  .sb-empty { font-size: 12px; padding: 16px 8px; }

  /* ---- 代码块字体 ---- */
  code, pre, .code, #cmd-input, [class*="code"] { font-family: "JetBrains Mono", "Fira Code", ui-monospace, Consolas, monospace; }
  @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
  .sb-loading {
    background: linear-gradient(90deg, var(--chip) 25%, var(--hover) 50%, var(--chip) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite;
    border-radius: 6px; height: 14px; margin: 4px 8px;
  }

  /* ---- 新对话空状态：输入框居中偏下（DeepSeek 式） ---- */
  #main.empty-state #stream {
    justify-content: center;
    padding-bottom: 38vh; /* 预留底部空间给输入框，横幅在上半区居中 */
  }
  #main.empty-state .welcome {
    margin: 0 auto;
  }
  #main.empty-state #input-bar {
    position: absolute;
    left: 0; right: 0;
    bottom: auto;
    top: 55%;
    z-index: 5;
  }

  /* ---- 响应式微调 ---- */
  @media (max-width: 768px) {
    #sidebar { width: 260px; }
    #topbar { padding: 0 14px; }
    #input-bar .i-row { padding: 0 12px; }
    #stream { padding: 14px 12px 18px; }
    .welcome { margin: 6vh auto 16px; padding: 20px 16px; }
    .welcome .w-title { font-size: 18px; }
    #model-chip { max-width: 140px; }
    .msg.user { max-width: 88%; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 左侧边栏（豆包式：功能菜单上半 + 会话列表下半 + 底部） -->
  <aside id="sidebar">
    <div class="sb-head">
      <span class="sb-logo">md-agent</span>
    </div>
    <div class="sb-search-wrap">
      <input id="sb-search" type="text" placeholder="搜索会话…" autocomplete="off" spellcheck="false">
    </div>
    <!-- 功能菜单：新对话 + 所有功能页面（点击在右侧详情页展示） -->
    <div id="sb-menu">
      <button id="session-new" class="sb-new" title="归档当前会话并开始新会话"><span class="mi-ico">💬</span><span>新对话</span></button>
      <div class="sb-group">功能</div>
      <button data-cmd="/view graph" data-view="graph" title="知识库结构导航（查看图谱）"><span class="mi-ico">🕸️</span><span>知识图谱</span></button>
      <button data-cmd="/view automation" data-view="automation" data-badge="review" title="自动化控制 + 审核 + 运营数据"><span class="mi-ico">🔄</span><span>自动化</span></button>
      <div class="sb-group">系统</div>
      <button data-cmd="/view market" data-view="market" title="工作台：我的应用 + 常用功能 + 应用市场"><span class="mi-ico">🗂️</span><span>工作台</span></button>
      <button data-cmd="/view config" data-view="config" title="模型/知识库/心跳配置"><span class="mi-ico">⚙️</span><span>设置</span></button>
      <button data-cmd="/side" title="命令面板 + 速览（Ctrl+K）"><span class="mi-ico">⌘</span><span>命令速览</span></button>
    </div>
    <div id="sb-list"><div class="sb-empty">加载中…</div></div>
    <div id="sb-foot">
      <span class="sb-ver">v<span id="sb-ver-num">?</span></span>
    </div>
  </aside>

  <!-- 主区：顶栏 + 消息流 + 底部输入条 + 内嵌详情页 -->
  <main id="main">
    <header id="topbar">
      <div id="topbar-title">新对话</div>
      <div id="topbar-right">
        <button id="project-chip" title="切换项目（每个项目独立知识空间）">🗂️ 个人空间</button>
        <button id="theme-btn" title="切换深色/亮色主题">☀️</button>
        <button id="model-chip" title="点击打开配置页">…</button>
      </div>
    </header>

    <div id="stream"></div>

    <div id="input-bar">
      <div id="ds-input-wrap">
        <div class="ds-project-row">
          <button class="ds-project-entry" id="ds-project-entry" title="切换项目">
            <span class="ds-pe-ico">🗂️</span>
            <span class="ds-pe-name">个人空间</span>
            <span class="ds-pe-arrow">▾</span>
          </button>
          <span class="ds-project-info" style="display:none"></span>
        </div>
        <textarea id="cmd-input" rows="1" placeholder="给 md-agent 发送消息…" autocomplete="off" spellcheck="false"></textarea>
        <div class="ds-toolbar">
          <div class="ds-toolbar-left">
            <button class="ds-toggle" id="think-toggle" title="深度思考"><span class="ds-ico">🧠</span><span>深度思考</span></button>
            <button class="ds-toggle" id="search-toggle" title="联网搜索"><span class="ds-ico">🌐</span><span>联网搜索</span></button>
          </div>
          <div class="ds-toolbar-right">
            <button class="ds-icon-btn" id="attach-btn" title="摄入文档（PDF/DOCX/PPT/XLS/EPUB → Markdown 进知识库）">📎</button>
            <input type="file" id="attach-file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.odt,.ods,.odp,.rtf,.epub" hidden>
            <input type="checkbox" id="web-toggle" hidden>
            <button id="send-btn" title="发送 (Enter)">↑</button>
          </div>
        </div>
      </div>
      <div id="statusline"></div>
    </div>

    <!-- /view 详情页（内嵌 #main，覆盖聊天区；单视图：新开替换旧的） -->
    <div id="view-overlay" class="hidden">
      <header>
        <span id="view-title">详情页</span>
        <div class="sp"></div>
        <button id="view-split" title="切换分屏">分屏</button>
        <button id="view-close" title="关闭当前视图 (Esc)">× 关闭</button>
      </header>
      <div id="view-panes"></div>
    </div>
  </main>
</div>

<!-- 补全下拉（锚定输入条上方） -->
<div id="completion"></div>

<!-- 命令面板 + 状态中心（保留，右侧抽屉） -->
<div id="side-drawer" class="hidden">
  <header>
    <span>命令面板</span>
    <button id="side-refresh" title="刷新">↻</button>
  </header>
  <div id="side-search-wrap">
    <input id="side-search" type="text" placeholder="搜索：视图 / 命令 / @文档（↑↓ 选择 · 回车执行 · Esc 关闭）" autocomplete="off" spellcheck="false">
    <div id="side-results"></div>
  </div>
  <div id="side-body"></div>
</div>

<!-- 项目切换菜单（项目制：个人空间 = 默认库；项目 = 独立隔离知识空间） -->
<div id="project-menu" hidden>
  <div id="pm-head">新建对话 · 选择项目</div>
  <div id="pm-list"></div>
  <button id="pm-new">＋ 新建项目</button>
  <div id="pm-msg">会话归属于项目；使用哪个项目的对话就自动操作哪个项目</div>
</div>

<!-- 新建项目向导（模板三卡 + 命名） -->
<div id="npw-overlay" hidden>
  <div id="npw-box">
    <h3>＋ 新建项目</h3>
    <div class="npw-tpls" id="npw-tpls"></div>
    <input id="npw-name" type="text" placeholder="项目名称，例如：张先生的劳动仲裁案" maxlength="60" autocomplete="off">
    <div id="npw-tip">项目之间完全隔离：笔记、对话、记忆互不串用</div>
    <div class="npw-actions">
      <button id="npw-cancel">取消</button>
      <button id="npw-create">创建并进入 →</button>
    </div>
  </div>
</div>

<!-- 命令参数弹窗（界面操作：点卡片 → 输入参数 → 直接执行） -->
<div id="pp-overlay" hidden>
  <div id="pp-box">
    <h3 id="pp-title">输入参数</h3>
    <div id="pp-desc"></div>
    <input id="pp-input" type="text" autocomplete="off">
    <div class="pp-actions">
      <button id="pp-cancel">取消</button>
      <button id="pp-run">执行</button>
    </div>
  </div>
</div>

<!-- 软确认弹窗（替代终端 y/n：写操作人审走页面内 modal，不再等按键） -->
<div id="cf-overlay" hidden>
  <div id="cf-box">
    <h3 id="cf-title">确认操作</h3>
    <div id="cf-msg"></div>
    <div class="pp-actions">
      <button id="cf-cancel">取消</button>
      <button id="cf-ok">确认</button>
    </div>
  </div>
</div>

<script src="stream.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
