<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>审核</title>
<style>
  :root { --bg:var(--bg); --panel:var(--chip); --panel2:var(--chip3); --line:var(--chip4);
          --fg:var(--fg); --dim:var(--muted); --green:var(--ok); --red:var(--danger);
          --yellow:var(--warn); --blue:var(--accent); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; color: var(--yellow); }
  .sp { flex: 1; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--blue); color: var(--blue); }
  button.primary { background: var(--green); color: var(--bg3); border-color: var(--green); font-weight: 600; }
  button.danger { background: var(--red); color: var(--bg3); border-color: var(--red); font-weight: 600; }
  button.ok { background: var(--green); color: var(--bg3); border-color: var(--green); font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: default; }

  /* 待审三栏（上 60%） */
  #main { flex: 0 0 60%; min-height: 0; display: flex; border-bottom: 1px solid var(--line); }
  .col { overflow: auto; padding: 10px; }
  #list-col { width: 260px; border-right: 1px solid var(--line); background: var(--panel); }
  #ctx-col { flex: 1; border-right: 1px solid var(--line); }
  #edit-col { width: 380px; display: flex; flex-direction: column; }

  .item { padding: 7px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 4px;
    display: flex; gap: 8px; align-items: baseline; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: var(--panel2); border: 1px solid var(--blue); }
  .item input { width: 13px; height: 13px; flex: none; margin-top: 3px; }
  .item .p { word-break: break-all; font-size: 12px; }
  .item .k { font-size: 10px; color: var(--dim); flex: none; }
  .item .k.note { color: var(--yellow); }
  .item .k.mem { color: var(--blue); }
  .item .k.skill { color: var(--purple); }
  .item .k.consolidate { color: var(--green); }

  h2 { font-size: 12px; color: var(--dim); margin-bottom: 8px; letter-spacing: 1px; }
  pre { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-all; line-height: 1.55; }
  pre .add { background: var(--ok-12); color: var(--green); display: block; }
  pre .ctx { color: var(--fg); display: block; }
  #empty { color: var(--dim); padding: 30px; text-align: center; }
  textarea { flex: 1; width: 100%; background: var(--bg3); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    font: 12px/1.6 Consolas, "Cascadia Mono", monospace; resize: none; outline: none; }
  textarea:focus { border-color: var(--blue); }
  #bar { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line);
    align-items: center; background: var(--panel); }
  #msg { font-size: 12px; color: var(--dim); }
  #msg.ok { color: var(--green); } #msg.err { color: var(--red); }

  /* 健康审计区（下 40%，可折叠） */
  #audit-main { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; }
  #audit-toggle { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; font-weight: 600; color: var(--blue); cursor: pointer; }
  #audit-toggle:hover { border-color: var(--blue); }
  #audit-toggle .chev { margin-left: auto; transition: transform .15s ease; }
  #audit-main.closed #audit-body { display: none; }
  #audit-main.closed .chev { transform: rotate(90deg); }
  #audit-body { margin-top: 10px; }
  #stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 12px; font-size: 12px; color: var(--dim); }
  .chip b { color: var(--fg); }
  .chip.warn b { color: var(--yellow); } .chip.bad b { color: var(--red); }
  .a-sec { margin-bottom: 14px; }
  .a-sec h2 { font-size: 13px; margin-bottom: 6px; }
  .a-sec h2 .n { color: var(--dim); font-weight: normal; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 6px; display: flex; gap: 10px; align-items: center; }
  .card .txt { flex: 1; min-width: 0; word-break: break-all; font-size: 12px; }
  .card .txt .src { color: var(--blue); }
  .card.done { opacity: 0.45; }
  .card.done .txt::after { content: ' ✓ 已应用'; color: var(--green); }
  .empty { color: var(--dim); font-size: 12px; padding: 4px 2px; }
</style>
</head>
<body>
<header>
  <h1>📥 审核</h1>
  <span id="count" style="color:var(--dim);font-size:12px"></span>
  <span class="sp"></span>
  <button onclick="refresh()">刷新</button>
</header>
<div id="main">
  <div class="col" id="list-col"><h2>待审清单（点击查看 / 勾选批量）</h2><div id="list"></div></div>
  <div class="col" id="ctx-col"><h2>目标文档上下文（绿色 = 将写入）</h2><div id="ctx"><div id="empty">选择左侧待审项查看写入位置</div></div></div>
  <div class="col" id="edit-col">
    <h2>待审内容（可编辑后批准）</h2>
    <textarea id="edit" placeholder="选择待审项…" disabled></textarea>
  </div>
</div>
<div id="bar">
  <button class="primary" id="btnApprove" onclick="act('approve')" disabled>✓ 批准</button>
  <button class="danger" id="btnReject" onclick="act('reject')" disabled>✕ 拒绝</button>
  <button id="btnEditApprove" onclick="act('approve', true)" disabled>✎ 按编辑内容批准</button>
  <span id="msg"></span>
</div>

<!-- 健康审计区（折叠）：悬空/孤立/无出链/重复标题/补链建议 -->
<div id="audit-main">
  <button id="audit-toggle">🩺 知识库健康审计<span class="chev">◀</span></button>
  <div id="audit-body">
    <div id="stats"></div>
    <div id="content">加载中…</div>
  </div>
</div>
<script>
  var state = { items: [], sel: null, preview: null };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
    });
  }
  function kindOf(p) {
    if (p.indexOf('MEMORY.') >= 0) return ['记忆条目', 'mem'];
    if (p.indexOf('SKILL.') >= 0) return ['技能提案', 'skill'];
    if (p.indexOf('CONSOLIDATE.') >= 0) return ['巩固提案', 'consolidate'];
    return ['新笔记', 'note'];
  }

  async function refresh() {
    var r = await hostApi('/api/kb/pending');
    state.items = r.pending || [];
    $('count').textContent = '共 ' + state.items.length + ' 条';
    var list = $('list');
    list.innerHTML = '';
    if (!state.items.length) {
      list.innerHTML = '<div style="color:var(--dim);padding:10px">待审区为空 ✓</div>';
      $('btnApprove').disabled = $('btnReject').disabled = $('btnEditApprove').disabled = true;
      $('edit').disabled = true;
      return;
    }
    state.items.forEach(function (it) {
      var row = document.createElement('div');
      row.className = 'item';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('click', function (e) { e.stopPropagation(); });
      var k = kindOf(it.path);
      var p = document.createElement('span');
      p.className = 'p';
      p.textContent = it.path.replace(/^pending\//, '');
      var kk = document.createElement('span');
      kk.className = 'k ' + k[1];
      kk.textContent = k[0];
      row.appendChild(cb); row.appendChild(kk); row.appendChild(p);
      row.addEventListener('click', function () { selectItem(it.path); });
      list.appendChild(row);
    });
    if (state.sel) selectItem(state.sel);
  }

  async function selectItem(rel) {
    state.sel = rel;
    var rows = document.querySelectorAll('#list .item');
    rows.forEach(function (r) { r.classList.remove('sel'); });
    var list = $('list');
    var items = list.querySelectorAll('.item');
    items.forEach(function (it) {
      var p = it.querySelector('.p');
      if (p && p.textContent === rel.replace(/^pending\//, '')) it.classList.add('sel');
    });
    $('btnApprove').disabled = $('btnReject').disabled = $('btnEditApprove').disabled = false;
    var edit = $('edit');
    edit.disabled = false;
    // 预览（目标/类型/将写入内容）
    var pr = await hostApi('/api/kb/pending/preview?path=' + encodeURIComponent(rel));
    state.preview = pr;
    edit.value = pr.added.replace(/^\n+/, '');
    // 目标文档上下文
    var ctxBox = $('ctx');
    var kindLabel = { memory: '记忆合并', note: '新笔记', skill: '技能安装到 skills/', consolidate: '替换目标文件' }[pr.kind] || pr.kind;
    ctxBox.innerHTML = '<h2>目标: ' + esc(pr.target) + '（' + kindLabel + '）</h2>';
    var pre = document.createElement('pre');
    if (pr.kind === 'memory' && pr.target) {
      var f = await hostApi('/api/file?path=' + encodeURIComponent(pr.target));
      var cur = (f && f.content) || '';
      // 目标现有内容逐行 + 新增行绿色
      var lines = cur.replace(/\n+$/, '').split('\n');
      lines.forEach(function (l) {
        var d = document.createElement('span');
        d.className = 'ctx';
        d.textContent = l || ' ';
        pre.appendChild(d);
      });
      pr.added.split('\n').forEach(function (l) {
        if (!l.trim()) return;
        var d = document.createElement('span');
        d.className = 'add';
        d.textContent = '+' + l;
        pre.appendChild(d);
      });
    } else {
      // 新笔记：直接展示将写入的全文（绿色）
      pr.added.split('\n').forEach(function (l) {
        var d = document.createElement('span');
        d.className = 'add';
        d.textContent = (l.trim() ? '+ ' : '') + l;
        pre.appendChild(d);
      });
    }
    ctxBox.appendChild(pre);
  }

  async function act(kind, edited) {
    var sel = state.sel;
    if (!sel) return;
    // 批量：收集勾选项（若勾选了则批量，否则单条）
    var checks = document.querySelectorAll('#list .item input:checked');
    var paths = [];
    if (checks.length) {
      var list = $('list');
      var items = list.querySelectorAll('.item');
      items.forEach(function (it) {
        var cb = it.querySelector('input');
        if (cb.checked) paths.push('pending/' + it.querySelector('.p').textContent);
      });
    } else {
      paths = [sel];
    }
    $('msg').className = '';
    $('msg').textContent = '处理中…';
    var ok = 0, errs = [];
    for (var i = 0; i < paths.length; i++) {
      try {
        if (kind === 'approve') {
          var body = { path: paths[i] };
          if (edited) body.content = $('edit').value;
          await hostApi('/api/kb/pending/approve', { method: 'POST', body: body });
        } else {
          await hostApi('/api/kb/pending/reject', { method: 'POST', body: { path: paths[i] } });
        }
        ok++;
      } catch (e) { errs.push(paths[i] + ': ' + e.message); }
    }
    var m = $('msg');
    m.className = errs.length ? 'err' : 'ok';
    m.textContent = '✓ 已' + (kind === 'approve' ? '批准' : '拒绝') + ' ' + ok + ' 条' +
      (errs.length ? '；失败: ' + errs.join('; ') : '');
    state.sel = null;
    $('edit').value = '';
    $('edit').disabled = true;
    $('btnApprove').disabled = $('btnReject').disabled = $('btnEditApprove').disabled = true;
    await refresh();
  }

  refresh().catch(function (e) {
    $('msg').className = 'err';
    $('msg').textContent = '加载失败: ' + e.message;
  });

  // ---- 健康审计区（原 audit.html 逻辑迁入；折叠切换） ----
  const auditMain = $('audit-main');
  $('audit-toggle').addEventListener('click', () => auditMain.classList.toggle('closed'));
  function aCard(html) {
    var d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = html;
    return d;
  }
  async function auditRefresh() {
    var r = await hostApi('/api/audit');
    var stats = $('stats');
    stats.innerHTML =
      '<span class="chip">文档 <b>' + r.docs + '</b></span>' +
      '<span class="chip">链接 <b>' + r.links + '</b></span>' +
      '<span class="chip' + (r.dangling.length ? ' warn' : '') + '">悬空 <b>' + r.dangling.length + '</b></span>' +
      '<span class="chip' + (r.orphans.length ? ' bad' : '') + '">孤立 <b>' + r.orphans.length + '</b></span>' +
      '<span class="chip' + (r.no_out.length ? ' warn' : '') + '">无出链 <b>' + r.no_out.length + '</b></span>' +
      '<span class="chip' + (r.duplicates.length ? ' warn' : '') + '">重复标题 <b>' + r.duplicates.length + '</b></span>' +
      '<span class="chip' + (r.mentions.length ? ' warn' : '') + '">补链建议 <b>' + r.mentions.length + '</b></span>';
    var c = $('content');
    c.innerHTML = '';

    // 补链接建议（可一键应用）
    var s1 = document.createElement('div');
    s1.className = 'a-sec';
    s1.innerHTML = '<h2>💡 建议补链接 <span class="n">(' + r.mentions.length + ') — 正文提到但未链接</span></h2>';
    if (!r.mentions.length) {
      var e = document.createElement('div'); e.className = 'empty'; e.textContent = '无建议 ✓';
      s1.appendChild(e);
    }
    r.mentions.forEach(function (m) {
      var d = aCard(
        '<span class="txt"><span class="src">' + esc(m.src) + '</span> → [[<b>' + esc(m.dst) + '</b>]]</span>' +
        '<button class="ok" onclick="applyLink(this, \'' + esc(m.src).replace(/'/g, "\\'") + '\', \'' + esc(m.dst_path || m.dst).replace(/'/g, "\\'") + '\')">应用</button>'
      );
      s1.appendChild(d);
    });
    c.appendChild(s1);

    // 悬空链接
    var s2 = document.createElement('div');
    s2.className = 'a-sec';
    s2.innerHTML = '<h2>⚠ 悬空链接 <span class="n">(' + r.dangling.length + ') — [[链接]] 指向不存在的文档</span></h2>';
    if (!r.dangling.length) {
      var e2 = document.createElement('div'); e2.className = 'empty'; e2.textContent = '无 ✓';
      s2.appendChild(e2);
    }
    r.dangling.forEach(function (d) {
      s2.appendChild(aCard('<span class="txt">' + esc(d[0]) + ' → <b style="color:var(--yellow)">[[' + esc(d[1]) + ']]</b>（需在源文档中修正或创建目标）</span>'));
    });
    c.appendChild(s2);

    // 孤立文档
    var s3 = document.createElement('div');
    s3.className = 'a-sec';
    s3.innerHTML = '<h2>🚫 孤立文档 <span class="n">(' + r.orphans.length + ') — 无入链也无出链</span></h2>';
    if (!r.orphans.length) {
      var e3 = document.createElement('div'); e3.className = 'empty'; e3.textContent = '无 ✓';
      s3.appendChild(e3);
    }
    r.orphans.forEach(function (p) {
      s3.appendChild(aCard('<span class="txt" style="color:var(--red)">' + esc(p) + '</span>'));
    });
    c.appendChild(s3);

    // 无出链
    var s4 = document.createElement('div');
    s4.className = 'a-sec';
    s4.innerHTML = '<h2>📄 无出链 <span class="n">(' + r.no_out.length + ')</span></h2>';
    if (!r.no_out.length) {
      var e4 = document.createElement('div'); e4.className = 'empty'; e4.textContent = '无 ✓';
      s4.appendChild(e4);
    }
    r.no_out.forEach(function (p) {
      s4.appendChild(aCard('<span class="txt">' + esc(p) + '</span>'));
    });
    c.appendChild(s4);

    // 重复标题
    var s5 = document.createElement('div');
    s5.className = 'a-sec';
    s5.innerHTML = '<h2>🔁 重复标题 <span class="n">(' + r.duplicates.length + ')</span></h2>';
    if (!r.duplicates.length) {
      var e5 = document.createElement('div'); e5.className = 'empty'; e5.textContent = '无 ✓';
      s5.appendChild(e5);
    }
    r.duplicates.forEach(function (d) {
      s5.appendChild(aCard('<span class="txt"><b>' + esc(d[0]) + '</b> ×' + d[1] + '<br><span style="color:var(--dim)">' + esc(d[2] || '') + '</span></span>'));
    });
    c.appendChild(s5);
  }
  window.applyLink = async function (btn, src, dst) {
    btn.disabled = true;
    try {
      await hostApi('/api/link', { method: 'POST', body: { src: src, dst: dst } });
      await auditRefresh(); // 补链成功 → 自动重跑审计（计数与建议列表即时更新）
    } catch (e) {
      btn.textContent = '失败';
      btn.disabled = false;
      alert('应用失败: ' + e.message);
    }
  };
  auditRefresh().catch(function (e) {
    $('content').innerHTML = '<div style="color:var(--red)">加载失败: ' + e.message + '</div>';
  });
</script>
</body>
</html>
