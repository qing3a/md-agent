<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>技能</title>
<style>
  :root { --bg:var(--bg); --panel:var(--chip); --panel2:var(--chip3); --line:var(--chip4);
          --fg:var(--fg); --dim:var(--muted); --green:var(--ok); --red:var(--danger);
          --yellow:var(--warn); --blue:var(--accent); --purple:var(--purple); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; color: var(--yellow); }
  .sp { flex: 1; }
  .meta { font-size: 11px; color: var(--dim); }
  #hubcount { color: var(--purple); }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--blue); color: var(--blue); }
  button.primary { background: var(--green); color: var(--bg3); border-color: var(--green); font-weight: 600; }
  button.danger { background: var(--red); color: var(--bg3); border-color: var(--red); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 11px; }

  #main { flex: 1; display: flex; min-height: 0; }
  .col { min-height: 0; display: flex; flex-direction: column; }
  /* 左列：已安装（窄，常驻） */
  #inst-col { width: 240px; border-right: 1px solid var(--line); background: var(--panel); }
  .col-head { padding: 10px 12px 6px; font-size: 12px; color: var(--dim);
    display: flex; align-items: center; gap: 6px; }
  .col-head b { color: var(--green); font-weight: 600; }
  /* 右列：未安装商店（宽，分组渲染） */
  #store-col { flex: 1; }
  #search-bar { padding: 10px 12px 6px; }
  #search { width: 100%; background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font-size: 12px; outline: none; }
  #search:focus { border-color: var(--blue); }
  #search-hint { margin-top: 4px; font-size: 11px; color: var(--dim); min-height: 14px; }
  .scroll { flex: 1; overflow: auto; padding: 0 10px 10px; }

  /* 条目两行：第一行 name 弹性省略 + 徽标固定右侧；第二行 id·版本·来源 单行省略（窄列不换行不溢出） */
  .item { padding: 7px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 4px; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: var(--panel2); border: 1px solid var(--blue); }
  .item .n { display: flex; align-items: center; gap: 6px; }
  .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .item .p { font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .bdg { flex: none; font-size: 10px; line-height: 16px; padding: 0 7px; border-radius: 8px; border: 1px solid var(--line); }
  .b-skill { color: var(--purple); }
  .b-app { color: var(--blue); }
  .b-inst { color: var(--green); border-color: var(--green); padding: 0 5px; }

  /* 分组标题（右列按 category 分组） */
  .grp { display: flex; align-items: center; gap: 6px; margin: 10px 4px 5px;
    font-size: 11.5px; color: var(--yellow); font-weight: 600; }
  .grp::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .grp .cnt { color: var(--dim); font-weight: 400; font-size: 10.5px; }

  .empty { color: var(--dim); text-align: center; padding: 30px 10px; font-size: 12px; }
  .empty code { color: var(--yellow); }
  #hint { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  #hint code { color: var(--yellow); }

  /* 详情弹层（点条目弹出；双列布局下无独立详情区） */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 11;
    display: flex; align-items: center; justify-content: center; }
  #overlay.hidden { display: none; }
  .ov-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; width: 480px; max-width: 92vw; max-height: 80vh; overflow: auto; }
  .ov-box h2 { font-size: 16px; margin-bottom: 4px; }
  .ov-meta { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .ov-desc { color: var(--fg); font-size: 12.5px; margin-bottom: 14px; }
  .ov-actions { display: flex; gap: 10px; align-items: center; }
  .ov-note { font-size: 11px; color: var(--dim); margin-top: 12px; }
  .ov-close { position: absolute; top: 10px; right: 12px; background: transparent; border: none;
    font-size: 16px; color: var(--dim); cursor: pointer; padding: 2px 6px; }
  .toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; display: none; z-index: 12; }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .toast.err { border-color: var(--red); color: var(--red); }
  /* 卸载确认层（沙箱无 allow-modals，原生 confirm 静默失效 → 页内 modal） */
  #cf-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 12;
    display: flex; align-items: center; justify-content: center; }
  #cf-overlay.hidden { display: none; }
  .cf-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; width: 420px; max-width: 90vw; }
  .cf-box h3 { color: var(--yellow); font-size: 14px; margin-bottom: 10px; }
  .cf-msg { font-size: 12px; color: var(--dim); margin-bottom: 14px; word-break: break-all; }
  .cf-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1>技能</h1>
  <span id="count" class="meta"></span>
  <span id="hubcount" class="meta" title="已连接 SkillHub"></span>
  <div class="sp"></div>
  <button id="connect">连接 hub</button>
  <button id="refresh" title="刷新">刷新</button>
</header>
<div id="main">
  <!-- 左列：已安装（单列常驻） -->
  <div id="inst-col" class="col">
    <div class="col-head">已安装 <b id="inst-count"></b></div>
    <div class="scroll" id="inst-items"></div>
  </div>
  <!-- 右列：未安装商店（按类别分组） -->
  <div id="store-col" class="col">
    <div id="search-bar">
      <input id="search" type="text" placeholder="🔍 检索 SkillHub 商店…" autocomplete="off">
      <div id="search-hint" class="meta"></div>
    </div>
    <div class="scroll" id="store-items"></div>
  </div>
</div>
<div id="hint">连接 SkillHub：<code>连接 hub</code> 或终端 <code>/skills connect &lt;url&gt;</code> · 安装走命令行（人审确认）：<code>/skills install &lt;id&gt;</code> · 右侧按类别分组浏览 · 点条目查看详情</div>
<div id="toast" class="toast"></div>

<!-- 卸载确认层（沙箱无 allow-modals，原生 confirm 静默失效 → 页内 modal） -->
<div id="cf-overlay" class="hidden">
  <div class="cf-box">
    <h3>确认卸载</h3>
    <div class="cf-msg" id="cf-msg"></div>
    <div class="cf-actions">
      <button id="cf-cancel">取消</button>
      <button id="cf-ok" class="danger">确认卸载</button>
    </div>
  </div>
</div>

<!-- 详情弹层（替代独立详情区；双列布局下点击条目弹出） -->
<div id="overlay" class="hidden">
  <div class="ov-box">
    <button class="ov-close" id="ov-close">✕</button>
    <h2 id="ov-name"></h2>
    <div class="ov-meta" id="ov-meta"></div>
    <div class="ov-desc" id="ov-desc"></div>
    <div class="ov-actions" id="ov-actions"></div>
    <div class="ov-note" id="ov-note"></div>
  </div>
</div>

<script>
var hubs = [], catalog = [], skills = [];
var installed = []; // 已装技能 [{id,name,title,trigger,desc,fname}]
var store = [];     // 未安装商店条目 [{id,name,version,desc,category,hub,kind,source}]
var searching = false;
var sel = null;

function $(id) { return document.getElementById(id); }
function toast(msg, ok) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2400);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ================= 数据构建 =================
// 商店条目按已装过滤：未安装 → 右列；已装 → 并入 installed（带商店信息）
function build() {
  var instById = {};
  skills.forEach(function (s) {
    var id = s.name.replace(/\.md$/, '');
    instById[id] = { id: id, name: s.title || id, trigger: s.trigger || '', desc: s.desc || '', fname: s.name, fromLocal: !catalog.some(function (c) { return c.id === id; }) };
  });
  catalog.forEach(function (a) {
    var id = a.id;
    if (instById[id]) {
      instById[id].name = a.name || instById[id].name;
      instById[id].desc = instById[id].desc || a.description || '';
      instById[id].version = a.version || '';
    } else {
      store.push(Object.assign({}, a, { id: id, kind: a.kind || 'skill' }));
    }
  });
  installed = Object.keys(instById).map(function (k) { return instById[k]; });
  installed.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
  store.sort(function (a, b) { return (b.downloads || 0) - (a.downloads || 0); });
}

// ================= 渲染 =================
function catLabel(c) { return { 'ai-agent': 'AI 智能体', 'knowledge-management': '知识管理', 'office-efficiency': '办公效率',
  'content-creation': '内容创作', 'data-analysis': '数据分析', 'dev-programming': '开发编程', 'design-media': '设计媒体',
  'life-service': '生活服务', 'professional': '专业服务', 'it-ops-security': '运维安全', 'business-ops': '业务运营',
  'other': '其他' }[c] || c; }

function itemHtml(a, i, kind) {
  var kindBadge = '<span class="bdg ' + (a.kind === 'app' ? 'b-app' : 'b-skill') + '">' + (a.kind === 'app' ? '应用' : '技能') + '</span>';
  return '<div class="item' + (sel && sel.list === kind && sel.id === a.id ? ' sel' : '') + '" data-i="' + i + '" data-list="' + kind + '">' +
    '<div class="n"><span class="nm" title="' + esc(a.name) + '">' + esc(a.name) + '</span>' + kindBadge + '</div>' +
    '<div class="p" title="' + esc(a.id) + '">' + esc(a.id) +
    (a.version ? ' · v' + esc(a.version) : '') +
    (a.trigger ? ' · 触发: ' + esc(a.trigger) : '') +
    (a.source ? '' : '') + '</div></div>';
}
function render() {
  $('hubcount').textContent = hubs.length ? '⚡ ' + hubs.length + ' hub' : '';
  $('count').textContent = searching
    ? '「' + ($('search').value || '') + '」' + store.length + ' 条'
    : '已装 ' + installed.length + ' · 商店 ' + store.length;
  // 左列：已安装
  $('inst-count').textContent = installed.length + ' 个';
  $('inst-items').innerHTML = installed.length
    ? installed.map(function (a, i) { return itemHtml(a, i, 'inst'); }).join('')
    : '<div class="empty">无已装技能<br>右侧商店浏览，<code>/skills install &lt;id&gt;</code> 安装</div>';
  // 右列：未安装商店（按 category 分组）
  var html = '';
  if (!store.length) {
    html = searching
      ? '<div class="empty">无匹配结果</div>'
      : (hubs.length ? '<div class="empty">商店目录为空<br><code>连接 hub</code> 换商店</div>'
        : '<div class="empty">未连接 SkillHub<br><br>点右上角 <code>连接 hub</code> 或终端<br><code>/skills connect &lt;url&gt;</code></div>');
  } else {
    var groups = {}, order = [];
    store.forEach(function (a) {
      var c = a.category || 'other';
      if (!groups[c]) { groups[c] = []; order.push(c); }
      groups[c].push(a);
    });
    order.sort(function (a, b) { return groups[b].length - groups[a].length; });
    var idx = 0;
    order.forEach(function (c) {
      html += '<div class="grp">' + esc(catLabel(c)) + '<span class="cnt">' + groups[c].length + '</span></div>';
      groups[c].forEach(function (a) { html += itemHtml(a, idx++, 'store'); });
    });
  }
  $('store-items').innerHTML = html;
}

// ================= 详情弹层 =================
function showDetail(a) {
  sel = a;
  $('ov-name').textContent = a.name + (a.version ? '  v' + a.version : '');
  var meta = 'id: ' + a.id + ' · ' + (a.list === 'inst' ? '已安装' : '来源 ' + (a.hub || 'skillhub.cn'));
  if (a.category) meta += ' · ' + esc(catLabel(a.category));
  if (a.trigger) meta += ' · 触发: ' + a.trigger;
  if (a.fname) meta += ' · 文件: ' + a.fname;
  $('ov-meta').textContent = meta;
  $('ov-desc').textContent = a.desc || a.description || '(无描述)';
  var acts = $('ov-actions');
  if (a.list === 'inst') {
    acts.innerHTML = '<button id="ov-uninstall" class="danger">卸载</button>' +
      '<span class="meta">' + (a.fromLocal ? '本地导入' : '已安装') + (a.trigger ? ' · trigger 命中自动注入' : '') + '</span>';
    $('ov-uninstall').addEventListener('click', function () { uninstallSkill(a); });
  } else {
    acts.innerHTML = '<span class="meta">安装（人审确认）：<code>/skills install ' + esc(a.id) + '</code></span>';
  }
  $('ov-note').textContent = a.source ? '' : '';
  $('overlay').classList.remove('hidden');
}
function closeDetail() { $('overlay').classList.add('hidden'); }

$('inst-items').addEventListener('click', function (e) {
  var el = e.target.closest('.item');
  if (!el) return;
  var i = +el.dataset.i;
  if (installed[i]) showDetail(Object.assign({ list: 'inst' }, installed[i]));
});
$('store-items').addEventListener('click', function (e) {
  var el = e.target.closest('.item');
  if (!el) return;
  var i = +el.dataset.i;
  var flat = [];
  var groups = {}, order = [];
  store.forEach(function (a) {
    var c = a.category || 'other';
    if (!groups[c]) { groups[c] = []; order.push(c); }
    groups[c].push(a);
  });
  order.sort(function (a, b) { return groups[b].length - groups[a].length; });
  order.forEach(function (c) { groups[c].forEach(function (a) { flat.push(a); }); });
  if (flat[i]) showDetail(Object.assign({ list: 'store' }, flat[i]));
});
$('ov-close').addEventListener('click', closeDetail);
$('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeDetail(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('overlay').classList.contains('hidden')) closeDetail(); });

// ---------- 卸载技能（/api/skills/delete + 页内确认层） ----------
var cfCb = null;
function cfConfirm(msg) {
  return new Promise(function (resolve) {
    cfCb = resolve;
    $('cf-msg').textContent = msg;
    $('cf-overlay').classList.remove('hidden');
  });
}
function closeCf(ok) {
  $('cf-overlay').classList.add('hidden');
  var cb = cfCb; cfCb = null;
  if (cb) cb(ok);
}
$('cf-ok').addEventListener('click', function () { closeCf(true); });
$('cf-cancel').addEventListener('click', function () { closeCf(false); });
$('cf-overlay').addEventListener('click', function (e) { if (e.target === $('cf-overlay')) closeCf(false); });

function uninstallSkill(a) {
  cfConfirm('确认卸载技能「' + a.name + '」？（删除 kb/skills/' + (a.fname || a.id + '.md') + '）').then(function (ok) {
    if (!ok) return;
    hostApi('/api/skills/delete', { method: 'POST', body: { name: a.fname || a.id } }).then(function () {
      toast('✓ 已卸载 ' + a.name, true);
      closeDetail();
      return load();
    }).catch(function (e) { toast('卸载失败: ' + e.message, false); });
  });
}

// ---------- 连接 hub ----------
$('connect').addEventListener('click', function () {
  var url = prompt('输入 SkillHub 来源：\n· skillhub.cn 商店（默认，检索+榜单）https://skillhub.cn/install/skillhub.md\n· git 仓库  git+https://github.com/user/skills-repo\n· GitHub zip https://github.com/user/skills-repo/archive/refs/heads/main.zip\n· 本地目录  local:C:/path/to/skills', 'https://skillhub.cn/install/skillhub.md');
  if (!url) return;
  hostApi('/api/hubs/connect', { method: 'POST', body: { url: url.trim() } }).then(function (r) {
    var kinds = {}; (r.hub.apps || []).forEach(function (a) { kinds[a.kind] = (kinds[a.kind] || 0) + 1; });
    var kt = Object.keys(kinds).map(function (k) { return kinds[k] + ' 个' + (k === 'app' ? '应用' : '技能'); }).join('、') || '0 个条目';
    toast('✓ 已连接 ' + r.hub.name + '（' + kt + '）', true);
    return load();
  }).catch(function (e) { toast('连接失败: ' + e.message, false); });
});

// ---------- 检索（右列搜索框：输入即商店检索） ----------
var searchTimer = null;
$('search').addEventListener('input', function () {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  if (!q) { searching = false; return load(); }
  searchTimer = setTimeout(function () {
    hostApi('/api/hubs/search', { method: 'POST', body: { q: q } }).then(function (r) {
      searching = true;
      var instIds = {};
      skills.forEach(function (s) { instIds[s.name.replace(/\.md$/, '')] = true; });
      // 搜索结果：已装的移入 installed（带商店信息），未装的进 store
      store = (r.apps || []).filter(function (a) { return !instIds[a.id]; });
      var hit = (r.apps || []).filter(function (a) { return instIds[a.id]; });
      hit.forEach(function (a) {
        var it = installed.find(function (x) { return x.id === a.id; });
        if (it) { it.version = a.version || it.version; it.desc = it.desc || a.description || ''; }
      });
      render();
    }).catch(function (e) { toast('检索失败: ' + e.message, false); });
  }, 450);
});

// ---------- 数据加载 ----------
async function load() {
  try {
    var rs = await Promise.all([
      hostApi('/api/hubs').catch(function () { return { hubs: [] }; }),
      hostApi('/api/market/catalog').catch(function () { return { apps: [] }; }),
      hostApi('/api/skills').catch(function () { return { skills: [] }; }),
    ]);
    hubs = rs[0].hubs || [];
    catalog = rs[1].apps || [];
    skills = rs[2].skills || [];
    searching = false;
    store = [];
    build();
    render();
  } catch (e) {
    $('store-items').innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>';
  }
}

$('refresh').addEventListener('click', function () { load(); });

load();
</script>
</body>
</html>
