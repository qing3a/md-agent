<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>技能</title>
<style>
  :root { --bg:var(--bg); --panel:var(--chip); --panel2:var(--chip3); --line:var(--chip4);
          --fg:var(--fg); --dim:var(--muted); --green:var(--ok); --red:var(--danger);
          --yellow:var(--warn); --blue:var(--accent); --purple:var(--purple); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; color: var(--yellow); }
  .sp { flex: 1; }
  .meta { font-size: 11px; color: var(--dim); }
  #hubcount { color: var(--purple); }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--blue); color: var(--blue); }
  button.primary { background: var(--green); color: var(--bg3); border-color: var(--green); font-weight: 600; }
  button.danger { background: var(--red); color: var(--bg3); border-color: var(--red); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 11px; }

  #main { flex: 1; display: flex; min-height: 0; }
  .col { min-height: 0; }
  #list-col { width: 280px; border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; }
  #search-bar { padding: 8px 10px 6px; }
  #search { width: 100%; background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font-size: 12px; outline: none; }
  #search:focus { border-color: var(--blue); }
  #search-hint { margin-top: 4px; font-size: 11px; color: var(--dim); min-height: 14px; }
  #items { flex: 1; overflow: auto; padding: 0 10px 10px; }
  #detail-col { flex: 1; overflow: auto; padding: 10px; }

  .item { padding: 7px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 4px; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: var(--panel2); border: 1px solid var(--blue); }
  /* 条目两行：第一行 name 弹性省略 + 徽标固定右侧；第二行 id·版本·来源 单行省略（窄列不换行不溢出） */
  .item .n { display: flex; align-items: center; gap: 6px; }
  .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .item .p { font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .bdg { flex: none; font-size: 10px; line-height: 16px; padding: 0 7px; border-radius: 8px; border: 1px solid var(--line); }
  .b-skill { color: var(--purple); }
  .b-app { color: var(--blue); }
  .b-inst { color: var(--green); border-color: var(--green); padding: 0 5px; }

  #detail { padding: 14px; display: none; }
  #detail h2 { font-size: 16px; margin-bottom: 4px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .desc { color: var(--fg); font-size: 12px; margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .upd-hint { font-size: 11px; color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 40px 10px; }
  #hint { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  #hint code { color: var(--yellow); }
  .toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; display: none; z-index: 12; }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .toast.err { border-color: var(--red); color: var(--red); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 11;
    display: flex; align-items: center; justify-content: center; }
  #overlay.hidden { display: none; }
  .ov-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; width: 440px; max-width: 92vw; max-height: 80vh; overflow: auto; }
  .ov-box h3 { color: var(--yellow); font-size: 14px; margin-bottom: 10px; }
  .ov-row { font-size: 12px; color: var(--dim); margin-bottom: 6px; word-break: break-all; }
  .ov-row b { color: var(--fg); }
  .ov-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .ov-note { font-size: 11px; color: var(--dim); margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>技能</h1>
  <span id="count" class="meta"></span>
  <span id="hubcount" class="meta" title="已连接 SkillHub"></span>
  <div class="sp"></div>
  <button id="connect">连接 hub</button>
  <button id="refresh" title="刷新">刷新</button>
</header>
<div id="main">
  <div id="list-col" class="col">
    <div id="search-bar">
      <input id="search" type="text" placeholder="🔍 检索 SkillHub 商店…" autocomplete="off">
      <div id="search-hint" class="meta"></div>
    </div>
    <div id="items"></div>
  </div>
  <div id="detail-col" class="col">
    <div id="detail">
      <h2 id="d-name"></h2>
      <div class="meta" id="d-meta"></div>
      <div class="desc" id="d-desc"></div>
      <div class="actions" id="d-actions"></div>
    </div>
    <div class="empty" id="empty"></div>
  </div>
</div>
<div id="hint">连接 SkillHub：<code>连接 hub</code> 或终端 <code>/skills connect &lt;url&gt;</code> · 支持 skillhub.cn 商店（默认，检索+榜单）/ git 仓库 / GitHub zip / 本地目录（自动分析 md 文档） · 安装走命令行（人审确认）：<code>/skills install &lt;id&gt;</code> 或 <code>/skills import &lt;路径&gt;</code></div>
<div id="toast" class="toast"></div>

<!-- 软确认弹窗（替代原生 confirm） -->
<div id="overlay" class="hidden">
  <div class="ov-box">
    <h3 id="ov-title">确认卸载</h3>
    <div id="ov-msg" class="ov-row"></div>
    <div class="ov-actions">
      <button id="ov-cancel">取消</button>
      <button id="ov-ok" class="danger">确认卸载</button>
    </div>
  </div>
</div>

<script>
var hubs = [], catalog = [], skills = [];
var list = [];       // 合并列表：[{id, name, title, version, desc, trigger, hub, installed, fromLocal}]
var searching = false; // 搜索态（列表 = 商店检索结果 + 已装标记）
var sel = null;

function $(id) { return document.getElementById(id); }
function toast(msg, ok) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2400);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ================= 合并列表 =================
// 商店目录条目与已装技能（kb/skills）按 id 合并：同 slug 已装 → 一条带 ✓；本地导入的补为独立条目
function buildList() {
  var byId = {};
  catalog.forEach(function (a) { byId[a.id] = Object.assign({}, a, { installed: false, fromLocal: false }); });
  skills.forEach(function (s) {
    var id = s.name.replace(/\.md$/, '');
    if (byId[id]) {
      byId[id].installed = true;
      byId[id].fname = s.name;
    } else {
      byId[id] = { id: id, name: s.title || id, title: s.title, version: '', desc: s.desc || '',
        trigger: s.trigger || '', hub: '本地', installed: true, fromLocal: true, kind: 'skill', fname: s.name };
    }
  });
  var out = Object.keys(byId).map(function (k) { return byId[k]; });
  // 已装排前（内部保持原排序），其余按原顺序（商店按下载量）
  out.sort(function (a, b) { return (b.installed ? 1 : 0) - (a.installed ? 1 : 0); });
  return out;
}

// ================= 渲染 =================
function render() {
  $('hubcount').textContent = hubs.length ? '⚡ ' + hubs.length + ' hub' : '';
  $('count').textContent = searching ? '「' + ($('search').value || '') + '」' + list.length + ' 条'
    : list.length + ' 项（已装 ' + list.filter(function (x) { return x.installed; }).length + '）';
  $('items').innerHTML = list.map(function (a, i) {
    var kindBadge = '<span class="bdg ' + (a.kind === 'app' ? 'b-app' : 'b-skill') + '">' + (a.kind === 'app' ? '应用' : '技能') + '</span>';
    var instBadge = a.installed ? '<span class="bdg b-inst" title="已安装">✓</span>' : '';
    return '<div class="item' + (sel && sel.id === a.id ? ' sel' : '') + '" data-i="' + i + '">' +
      '<div class="n"><span class="nm" title="' + esc(a.name) + '">' + esc(a.name) + '</span>' + kindBadge + instBadge + '</div>' +
      '<div class="p" title="' + esc(a.id) + '">' + esc(a.id) +
      (a.version ? ' · v' + esc(a.version) : '') +
      ' · [' + esc(a.hub || 'skillhub.cn') + ']' + '</div></div>';
  }).join('');
  var empty = $('empty');
  if (!list.length) {
    empty.style.display = 'block';
    empty.innerHTML = hubs.length
      ? '目录为空<br><br>终端 <code>/skills search &lt;关键词&gt;</code> 检索，或 <code>连接 hub</code> 换商店'
      : '未连接 SkillHub<br><br>点右上角 <code>连接 hub</code> 或终端 <code>/skills connect &lt;url&gt;</code>';
    $('detail').style.display = 'none';
  } else {
    empty.style.display = 'none';
    if (sel) showDetail(sel); else $('detail').style.display = 'none';
  }
}
function showDetail(a) {
  sel = a;
  $('detail').style.display = 'block';
  $('d-name').textContent = a.name + (a.version ? '  v' + a.version : '');
  var meta = 'id: ' + a.id + ' · 来源 ' + (a.hub || 'skillhub.cn');
  if (a.trigger) meta += ' · 触发: ' + a.trigger;
  if (a.fname) meta += ' · 文件: ' + a.fname;
  $('d-meta').textContent = meta;
  $('d-desc').textContent = a.desc || a.description || '(无描述)';
  var acts = $('d-actions');
  if (a.installed) {
    acts.innerHTML = '<span class="upd-hint">已安装' + (a.trigger ? '（trigger 命中自动注入 Agent）' : '') + '</span>' +
      '<button id="act-uninstall" class="danger">卸载</button>';
    $('act-uninstall').addEventListener('click', function () { uninstallSkill(a); });
  } else {
    acts.innerHTML = '<span class="upd-hint">安装（人审确认）：<code>/skills install ' + esc(a.id) + '</code></span>';
  }
  renderListSel();
}
function renderListSel() {
  Array.prototype.forEach.call(document.querySelectorAll('#items .item'), function (el) {
    el.classList.toggle('sel', sel && el.dataset.i && list[+el.dataset.i] && list[+el.dataset.i].id === sel.id);
  });
}

$('items').addEventListener('click', function (e) {
  var el = e.target.closest('.item');
  if (!el) return;
  var i = +el.dataset.i;
  if (list[i]) showDetail(list[i]);
});

// ---------- 卸载技能（/api/skills/delete + 软确认） ----------
function uninstallSkill(a) {
  uiConfirm('确认卸载技能「' + a.name + '」？（删除 kb/skills/' + (a.fname || a.id + '.md') + '）').then(function (ok) {
    if (!ok) return;
    hostApi('/api/skills/delete', { method: 'POST', body: { name: a.fname || a.id } }).then(function () {
      toast('✓ 已卸载 ' + a.name, true);
      sel = null;
      return load();
    }).catch(function (e) { toast('卸载失败: ' + e.message, false); });
  });
}

// ---------- 连接 hub ----------
$('connect').addEventListener('click', function () {
  var url = prompt('输入 SkillHub 来源：\n· skillhub.cn 商店（默认，检索+榜单）https://skillhub.cn/install/skillhub.md\n· git 仓库  git+https://github.com/user/skills-repo\n· GitHub zip https://github.com/user/skills-repo/archive/refs/heads/main.zip\n· 本地目录  local:C:/path/to/skills', 'https://skillhub.cn/install/skillhub.md');
  if (!url) return;
  hostApi('/api/hubs/connect', { method: 'POST', body: { url: url.trim() } }).then(function (r) {
    var kinds = {}; (r.hub.apps || []).forEach(function (a) { kinds[a.kind] = (kinds[a.kind] || 0) + 1; });
    var kt = Object.keys(kinds).map(function (k) { return kinds[k] + ' 个' + (k === 'app' ? '应用' : '技能'); }).join('、') || '0 个条目';
    toast('✓ 已连接 ' + r.hub.name + '（' + kt + '）', true);
    sel = null;
    return load();
  }).catch(function (e) { toast('连接失败: ' + e.message, false); });
});

// ---------- 检索（搜索框常驻：输入即商店检索，结果带已装标记） ----------
var searchTimer = null;
$('search').addEventListener('input', function () {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  if (!q) { searching = false; sel = null; return load(); }
  searchTimer = setTimeout(function () {
    hostApi('/api/hubs/search', { method: 'POST', body: { q: q } }).then(function (r) {
      searching = true;
      var res = (r.apps || []).map(function (a) { return Object.assign({}, a, { installed: false }); });
      var byId = {};
      res.forEach(function (a) { byId[a.id] = a; });
      skills.forEach(function (s) {
        var id = s.name.replace(/\.md$/, '');
        if (byId[id]) { byId[id].installed = true; byId[id].fname = s.name; }
      });
      list = res;
      sel = null;
      render();
    }).catch(function (e) { toast('检索失败: ' + e.message, false); });
  }, 450);
});

// ---------- 数据加载 ----------
async function load() {
  try {
    var rs = await Promise.all([
      hostApi('/api/hubs').catch(function () { return { hubs: [] }; }),
      hostApi('/api/market/catalog').catch(function () { return { apps: [] }; }),
      hostApi('/api/skills').catch(function () { return { skills: [] }; }),
    ]);
    hubs = rs[0].hubs || [];
    catalog = rs[1].apps || [];
    skills = rs[2].skills || [];
    searching = false;
    list = buildList();
    render();
  } catch (e) {
    $('items').innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>';
  }
}

// 软确认弹窗：页内 modal（替代原生 confirm），Promise<boolean>
var ovCb = null;
function uiConfirm(msg) {
  return new Promise(function (resolve) {
    ovCb = resolve;
    $('ov-msg').textContent = msg;
    $('overlay').classList.remove('hidden');
  });
}
function closeOv(ok) {
  $('overlay').classList.add('hidden');
  var cb = ovCb; ovCb = null;
  if (cb) cb(ok);
}
$('ov-ok').addEventListener('click', function () { closeOv(true); });
$('ov-cancel').addEventListener('click', function () { closeOv(false); });
$('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeOv(false); });
document.addEventListener('keydown', function (e) {
  if (ovCb && e.key === 'Escape') closeOv(false);
});
$('refresh').addEventListener('click', function () { sel = null; load(); });

load();
</script>
</body>
</html>
