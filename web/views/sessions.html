<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>md-agent 历史会话</title>
<style>
  :root {
    --bg: var(--bg); --panel: var(--chip); --panel2: var(--chip3);
    --fg: var(--fg); --dim: var(--muted); --line: var(--chip4);
    --blue: var(--accent); --cyan: var(--info); --yellow: var(--warn);
    --green: var(--ok); --red: var(--danger); --purple: var(--purple);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 18px; color: var(--cyan); }
  .stats { display: flex; gap: 8px; }
  .stats .chip { background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 12px; font-size: 12px; color: var(--dim); }
  .stats .chip b { color: var(--fg); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .row:hover { border-color: var(--blue); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.archived { background: var(--dim); }
  .row .id { font-family: Consolas, monospace; font-size: 12px; color: var(--dim); flex-shrink: 0; }
  .row .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 12px; color: var(--dim); flex-shrink: 0; }
  .row .cmd { font-family: Consolas, monospace; font-size: 12px; color: var(--blue);
    background: var(--panel2); border-radius: 6px; padding: 2px 8px; flex-shrink: 0; }
  .empty { color: var(--dim); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>历史会话</h1>
  <div class="stats" id="stats"></div>
</header>
<div class="list" id="list"><div class="empty">加载中…</div></div>
<script>
async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function load() {
  const d = await api('/api/sessions');
  const list = d.sessions || [];
  const active = list.filter((s) => s.status === 'active').length;
  document.getElementById('stats').innerHTML =
    '<span class="chip">全部 <b>' + list.length + '</b></span>' +
    '<span class="chip">进行中 <b>' + active + '</b></span>';
  const box = document.getElementById('list');
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="empty">暂无历史会话——问答防抖落盘 kb/sessions/，/clear 或关闭页面时归档</div>';
    return;
  }
  for (const s of list) {
    const row = document.createElement('div');
    row.className = 'row';
    const dot = document.createElement('span');
    dot.className = 'dot ' + (s.status === 'active' ? 'active' : 'archived');
    const d = s.date || (s.mtime ? new Date(s.mtime * 1000).toISOString().slice(0, 10) : '-');
    row.innerHTML =
      '<span class="id">' + s.id + '</span>' +
      '<span class="title">' + (s.title || '(无标题)') + '</span>' +
      '<span class="meta">' + s.count + ' 轮 · ' + d + '</span>' +
      '<span class="cmd">/resume ' + s.id + '</span>';
    row.prepend(dot);
    box.appendChild(row);
  }
}
load().catch((e) => { document.getElementById('list').innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>'; });
</script>
</body>
</html>
