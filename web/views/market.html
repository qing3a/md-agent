<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工作台</title>
<style>
  :root { --bg:var(--bg); --panel:var(--chip); --panel2:var(--chip3); --line:var(--chip4);
          --fg:var(--fg); --dim:var(--muted); --green:var(--ok); --red:var(--danger);
          --yellow:var(--warn); --blue:var(--accent); --purple:var(--purple); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; color: var(--yellow); }
  .sp { flex: 1; }
  .meta { font-size: 11px; color: var(--dim); }
  #hubcount { color: var(--purple); }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--blue); color: var(--blue); }
  button.primary { background: var(--green); color: var(--bg3); border-color: var(--green); font-weight: 600; }
  button.danger { background: var(--red); color: var(--bg3); border-color: var(--red); font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.small { padding: 2px 8px; font-size: 11px; }

  /* ---- 工作台视图 ---- */
  #wb { flex: 1; overflow: auto; padding: 14px 18px; }
  .wb-sec { margin-bottom: 18px; }
  .wb-sec-title { color: var(--dim); font-size: 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px; }
  .wb-sec-title::before { content: ''; width: 3px; height: 13px; background: var(--blue); border-radius: 2px; }
  .wb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .wb-card { display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer;
    transition: border-color .15s; }
  .wb-card:hover { border-color: var(--blue); }
  .wb-ico { font-size: 26px; flex: none; width: 40px; text-align: center; }
  .wb-info { flex: 1; min-width: 0; }
  .wb-name { font-weight: 600; font-size: 13px; }
  .wb-name .v { font-size: 10px; color: var(--dim); margin-left: 6px; font-weight: 400; }
  .wb-desc { font-size: 11px; color: var(--dim); word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wb-acts { display: flex; gap: 6px; flex: none; }
  .wb-func .wb-go { color: var(--dim); font-size: 14px; flex: none; }
  .wb-func:hover .wb-go { color: var(--blue); }
  .wb-empty { color: var(--dim); font-size: 12px; padding: 22px 0; text-align: center;
    border: 1px dashed var(--line); border-radius: 10px; }
  .wb-status { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11.5px;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .wb-status b { color: var(--fg); }

  /* ---- 市场视图（二级入口） ---- */
  #mkt { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #mkt-back { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  #main { flex: 1; display: flex; min-height: 0; }
  .col { min-height: 0; }
  #list-col { width: 260px; border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; }
  #tabs { display: flex; gap: 4px; padding: 8px 10px; }
  .tab { flex: 1; background: transparent; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 0; font-size: 12px; cursor: pointer; color: var(--dim); }
  .tab.sel { background: var(--panel2); border-color: var(--blue); color: var(--blue); font-weight: 600; }
  #items { flex: 1; overflow: auto; padding: 0 10px 10px; }
  #detail-col { flex: 1; overflow: auto; padding: 10px; }

  .item { padding: 8px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 4px; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: var(--panel2); border: 1px solid var(--blue); }
  .item .n { font-weight: 600; }
  .item .v { font-size: 10px; color: var(--dim); margin-left: 6px; }
  .item .src { font-size: 10px; color: var(--purple); margin-left: 6px; }
  .item .p { font-size: 11px; color: var(--dim); word-break: break-all; }

  #detail { padding: 14px; display: none; }
  #detail h2 { font-size: 16px; margin-bottom: 4px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .perms { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .perm { background: var(--panel2); border: 1px solid var(--line); color: var(--blue);
    border-radius: 10px; padding: 1px 10px; font-size: 11px; }
  .desc { color: var(--fg); font-size: 12px; margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .upd-hint { font-size: 11px; color: var(--dim); }
  .empty { color: var(--dim); text-align: center; padding: 40px 10px; }
  #hint { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  #hint code { color: var(--yellow); }
  .toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; display: none; z-index: 12; }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .toast.err { border-color: var(--red); color: var(--red); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 11;
    display: flex; align-items: center; justify-content: center; }
  #overlay.hidden { display: none; }
  .ov-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; width: 440px; max-width: 92vw; max-height: 80vh; overflow: auto; }
  .ov-box h3 { color: var(--yellow); font-size: 14px; margin-bottom: 10px; }
  .ov-row { font-size: 12px; color: var(--dim); margin-bottom: 6px; word-break: break-all; }
  .ov-row b { color: var(--fg); }
  .ov-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .ov-note { font-size: 11px; color: var(--dim); margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1 id="wb-title">工作台</h1>
  <span id="wb-count" class="meta"></span>
  <span id="hubcount" class="meta" title="已连接 SkillHub"></span>
  <div class="sp"></div>
  <button id="mkt-btn" title="连接 SkillHub / 浏览第三方目录 / 安装应用">🛒 应用市场</button>
  <button id="refresh" style="display:none" title="刷新市场目录">刷新</button>
</header>

<!-- 工作台视图（默认：我的应用 + 任务入口 + 状态速览） -->
<div id="wb">
  <div class="wb-sec">
    <div class="wb-sec-title">我的应用 <span id="wb-appcount" class="meta"></span></div>
    <div id="wb-apps" class="wb-grid"></div>
  </div>
  <div class="wb-sec">
    <div class="wb-sec-title">快捷</div>
    <div id="wb-quick" class="wb-grid"></div>
  </div>
  <div class="wb-status" id="wb-status"></div>
</div>

<!-- 市场视图（二级入口：连接 hub / 目录 / 安装说明） -->
<div id="mkt" style="display:none">
  <div id="mkt-back">
    <button id="mkt-back-btn">← 返回工作台</button>
    <span id="count" class="meta"></span>
    <span id="hubcount" class="meta" title="已连接 SkillHub"></span>
    <span class="sp"></span>
    <button id="connect">连接 hub</button>
  </div>
  <div id="main">
    <div id="list-col" class="col">
      <div id="tabs">
        <button id="tab-catalog" class="tab">目录</button>
        <button id="tab-installed" class="tab">已安装</button>
      </div>
      <div id="items"></div>
    </div>
    <div id="detail-col" class="col">
      <div id="detail">
        <h2 id="d-name"></h2>
        <div class="meta" id="d-meta"></div>
        <div class="perms" id="d-perms"></div>
        <div class="desc" id="d-desc"></div>
        <div class="actions" id="d-actions"></div>
      </div>
      <div class="empty" id="empty"></div>
    </div>
  </div>
  <div id="hint">连接 SkillHub：<code>连接 hub</code> 或终端 <code>/market connect &lt;url&gt;</code> · 安装走命令行（人审确认）：<code>/market install &lt;id&gt;</code> 或 <code>/market import &lt;路径&gt;</code> · 更新走 <code>/market update &lt;id&gt; &lt;路径&gt;</code> · 运行在宿主新标签打开</div>
</div>
<div id="toast" class="toast"></div>

<!-- 软确认弹窗（替代原生 confirm） -->
<div id="overlay" class="hidden">
  <div class="ov-box">
    <h3 id="ov-title">确认卸载</h3>
    <div id="ov-msg" class="ov-row"></div>
    <div class="ov-actions">
      <button id="ov-cancel">取消</button>
      <button id="ov-ok" class="danger">确认卸载</button>
    </div>
  </div>
</div>

<script>
var hubs = [], catalog = [], apps = [];
var catalogView = []; // 渲染用目录（已安装优先排序；与 data-i 索引保持一致）
var loadedOnce = false; // 市场视图首次加载默认 Tab = 已安装（有已装应用时）
var tab = 'catalog'; // 'catalog' | 'installed'（市场视图内）
var sel = null; // { kind: 'cat' | 'inst', ...条目字段 }
var view = 'wb'; // 'wb' 工作台 | 'mkt' 市场
var wbStats = { documents: 0, links: 0, pending: 0, tasks: 0 };

function $(id) { return document.getElementById(id); }
function toast(msg, ok) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2400);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
// 无 icon 字段 → 按权限推断 emoji（llm=智能 / storage=数据 / 默认包）
function appIco(a) {
  if (!a || !a.permissions) return '📦';
  if (a.permissions.indexOf('llm') !== -1) return '🤖';
  if (a.permissions.indexOf('storage') !== -1) return '🗄️';
  return '📦';
}

// ================= 工作台 =================
function renderWorkbench() {
  $('wb-count').textContent = apps.length + ' 个应用';
  var box = $('wb-apps');
  $('wb-appcount').textContent = apps.length + ' 个';
  if (!apps.length) {
    box.innerHTML = '<div class="wb-empty">还没有应用 —— 点右上角「🛒 应用市场」浏览目录或终端 <code>/market import &lt;路径&gt;</code> 导入</div>';
  } else {
    box.innerHTML = apps.map(function (a) {
      return '<div class="wb-card" data-id="' + esc(a.id) + '">' +
        '<div class="wb-ico">' + appIco(a) + '</div>' +
        '<div class="wb-info">' +
        '<div class="wb-name">' + esc(a.name) + '<span class="v">v' + esc(a.version) + '</span></div>' +
        '<div class="wb-desc">' + esc(a.description || a.id) + '</div></div>' +
        '<div class="wb-acts">' +
        '<button class="primary" data-run="' + esc(a.id) + '">运行</button>' +
        '<button class="small" data-uni="' + esc(a.id) + '">卸载</button></div></div>';
    }).join('');
  }
  $('wb-status').innerHTML =
    '文档 <b>' + wbStats.documents + '</b> · 链接 <b>' + wbStats.links + '</b>' +
    ' · 待审 <b style="color:' + (wbStats.pending ? 'var(--yellow)' : 'var(--fg)') + '">' + wbStats.pending + '</b>' +
    ' · 任务 <b>' + wbStats.tasks + '</b>';
  // 快捷入口：任务看板（用户决策：工作台保留任务入口）
  $('wb-quick').innerHTML =
    '<div class="wb-card wb-func" data-cmd="/view board" title="任务看板：目标拆解 · 依赖校验 · 进度跟踪">' +
    '<div class="wb-ico">📋</div>' +
    '<div class="wb-info"><div class="wb-name">任务看板</div><div class="wb-desc">目标拆解 · 依赖校验 · 进度跟踪</div></div>' +
    '<div class="wb-go">→</div></div>';
}
// 工作台事件委托：运行 / 卸载 / 快捷入口
$('wb-apps').addEventListener('click', function (e) {
  var run = e.target.closest('[data-run]');
  var uni = e.target.closest('[data-uni]');
  if (run) { runApp(run.getAttribute('data-run')); return; }
  if (uni) { uninstallApp(uni.getAttribute('data-uni')); return; }
  var card = e.target.closest('.wb-card');
  if (card) runApp(card.getAttribute('data-id'));
});
$('wb-quick').addEventListener('click', function (e) {
  var el = e.target.closest('[data-cmd]');
  if (el) window.parent.postMessage({ type: 'cmd', cmd: el.getAttribute('data-cmd') }, '*');
});
function showView(v) {
  view = v;
  $('wb').style.display = v === 'wb' ? 'block' : 'none';
  $('mkt').style.display = v === 'mkt' ? 'flex' : 'none';
  $('mkt-btn').style.display = v === 'wb' ? '' : 'none';
  $('refresh').style.display = v === 'mkt' ? '' : 'none';
  $('wb-title').textContent = v === 'wb' ? '工作台' : '应用市场';
  if (v === 'mkt') loadMarket();
  if (v === 'wb') load();
}

// ================= 市场视图 =================
function permHtml(perms) {
  return (perms && perms.length)
    ? perms.map(function (p) { return '<span class="perm">' + esc(p) + '</span>'; }).join('')
    : '<span class="perm" style="color:var(--dim)">无权限</span>';
}
function render() {
  $('hubcount').textContent = hubs.length ? '⚡ ' + hubs.length + ' hub' : '';
  $('count') && ($('count').textContent = (tab === 'catalog' ? catalog.length + ' 个可用' : apps.length + ' 个已安装'));
  $('tab-catalog').classList.toggle('sel', tab === 'catalog');
  $('tab-installed').classList.toggle('sel', tab === 'installed');
  var items = $('items');
  if (tab === 'catalog') {
    // 已安装优先：目录里已装的应用排最前并标注（打开市场最关心自己装了什么）
    var instIds = {};
    apps.forEach(function (a) { instIds[a.id] = true; });
    catalogView = catalog.slice().sort(function (a, b) {
      return (instIds[a.id] ? 0 : 1) - (instIds[b.id] ? 0 : 1);
    });
    items.innerHTML = catalogView.map(function (a, i) {
      var kindBadge = a.kind === 'skill' ? '<span class="src">[技能]</span>' : '';
      var instBadge = instIds[a.id] ? '<span class="src" style="color:var(--green)">[已安装]</span>' : '';
      return '<div class="item' + (sel && sel.kind === 'cat' && sel.id === a.id ? ' sel' : '') + '" data-i="' + i + '">' +
        '<div class="n">' + esc(a.name) + '<span class="v">v' + esc(a.version) + '</span><span class="src">[' + esc(a.hub) + ']</span>' + kindBadge + instBadge + '</div>' +
        '<div class="p">' + esc(a.id) + ' · [' + esc((a.permissions || []).join(',')) + ']</div></div>';
    }).join('');
  } else {
    items.innerHTML = apps.map(function (a, i) {
      return '<div class="item' + (sel && sel.kind === 'inst' && sel.id === a.id ? ' sel' : '') + '" data-i="' + i + '">' +
        '<div class="n">' + esc(a.name) + '<span class="v">v' + esc(a.version) + '</span>' +
        (a.source_hub ? '<span class="src">[' + esc(a.source_hub) + ']</span>' : '') + '</div>' +
        '<div class="p">' + esc(a.id) + ' · [' + esc((a.permissions || []).join(',')) + ']</div></div>';
    }).join('');
  }
  var empty = $('empty');
  var has = tab === 'catalog' ? catalog.length : apps.length;
  if (!has) {
    empty.style.display = 'block';
    empty.innerHTML = tab === 'catalog'
      ? '未连接 SkillHub<br><br>点右上角 <code>连接 hub</code> 或终端 <code>/market connect &lt;url&gt;</code>'
      : '无已安装应用<br><br>从「目录」Tab 安装，或终端 <code>/market import &lt;路径&gt;</code>';
    $('detail').style.display = 'none';
  } else {
    empty.style.display = 'none';
    if (sel) showDetail(sel); else $('detail').style.display = 'none';
  }
}
function showDetail(s) {
  sel = s;
  $('detail').style.display = 'block';
  $('d-name').textContent = s.name + '  v' + s.version;
  var meta = 'id: ' + s.id + ' · entry: ' + (s.entry || 'index.html');
  if (s.hub) meta += ' · 来源 ' + s.hub;
  else if (s.source_hub) meta += ' · 来源 ' + s.source_hub;
  else if (s.kind === 'inst') meta += ' · 来源 本地导入';
  $('d-meta').textContent = meta;
  $('d-perms').innerHTML = permHtml(s.permissions);
  $('d-desc').textContent = s.description || '(无描述)';
  var acts = $('d-actions');
  if (s.kind === 'cat') {
    // 目录条目只浏览：安装走命令行（第三方 hub 无稳定 API，安装需显式确认来源）
    acts.innerHTML = '<span class="upd-hint">安装（人审确认）：<code>/market install ' + esc(s.id) + '</code>（应用或技能按内容自动识别）<br>兜底：<code>/market import &lt;路径&gt;</code> 手动导入</span>';
  } else {
    acts.innerHTML = '<button id="act-run" class="primary">运行</button>' +
      '<button id="act-uninstall" class="danger">卸载</button>' +
      '<span class="upd-hint">更新：/market update ' + esc(s.id) + ' &lt;路径&gt;</span>';
    $('act-run').addEventListener('click', function () { runApp(s.id); });
    $('act-uninstall').addEventListener('click', function () { uninstallApp(s.id, s.name); });
  }
  renderListSel();
}
function renderListSel() {
  Array.prototype.forEach.call(document.querySelectorAll('#items .item'), function (el) {
    el.classList.toggle('sel', sel && el.dataset.i && currentList()[+el.dataset.i] && currentList()[+el.dataset.i].id === sel.id);
  });
}
function currentList() { return tab === 'catalog' ? catalogView : apps; }

$('items').addEventListener('click', function (e) {
  var el = e.target.closest('.item');
  if (!el) return;
  var i = +el.dataset.i;
  var list = currentList();
  if (!list[i]) return;
  var a = list[i];
  showDetail({ kind: tab === 'catalog' ? 'cat' : 'inst', id: a.id, name: a.name, version: a.version,
    entry: a.entry, permissions: a.permissions, description: a.description, hub: a.hub, source_hub: a.source_hub });
});

$('tab-catalog').addEventListener('click', function () { tab = 'catalog'; sel = null; render(); });
$('tab-installed').addEventListener('click', function () { tab = 'installed'; sel = null; render(); });
$('refresh').addEventListener('click', loadMarket);
$('mkt-btn').addEventListener('click', function () { showView('mkt'); });
$('mkt-back-btn').addEventListener('click', function () { showView('wb'); });

// ---------- 运行 / 卸载 ----------
function runApp(id) {
  window.parent.postMessage({ type: 'cmd', cmd: '/view ' + id }, '*');
}
function uninstallApp(id, name) {
  uiConfirm('确认卸载 ' + name + '（' + id + '）？（应用目录将被删除）').then(function (ok) {
    if (!ok) return;
    hostApi('/api/market/uninstall', { method: 'POST', body: { id: id } }).then(function () {
      toast('✓ 已卸载 ' + id, true);
      sel = null;
      return load();
    }).catch(function (e) { toast('卸载失败: ' + e.message, false); });
  });
}

// ---------- 连接 hub ----------
$('connect') && $('connect').addEventListener('click', function () {
  var url = prompt('输入 SkillHub 索引 URL：', 'https://skillhub.cn/install/skillhub.md');
  if (!url) return;
  hostApi('/api/hubs/connect', { method: 'POST', body: { url: url.trim() } }).then(function (r) {
    toast('✓ 已连接 ' + r.hub.name + '（' + r.hub.apps.length + ' 个应用）', true);
    tab = 'catalog'; sel = null;
    return loadMarket();
  }).catch(function (e) { toast('连接失败: ' + e.message, false); });
});

// ---------- 数据加载 ----------
async function load() {
  try {
    var rs = await Promise.all([
      hostApi('/api/apps').catch(function () { return { apps: [] }; }),
      hostApi('/api/graph/stats').catch(function () { return {}; }),
      hostApi('/api/kb/pending').catch(function () { return { pending: [] }; }),
      hostApi('/api/tasks').catch(function () { return { tasks: [] }; }),
    ]);
    apps = rs[0].apps || [];
    var g = rs[1] || {};
    wbStats.documents = g.docs || g.documents || g.nodes || 0;
    wbStats.links = g.links || g.edges || 0;
    wbStats.pending = (rs[2].pending || []).length;
    wbStats.tasks = (rs[3].tasks || []).length;
    renderWorkbench();
    if (view === 'mkt') render();
  } catch (e) {
    $('wb-apps').innerHTML = '<div class="wb-empty">加载失败: ' + esc(e.message) + '</div>';
  }
}
async function loadMarket() {
  try {
    var rs = await Promise.all([
      hostApi('/api/hubs').catch(function () { return { hubs: [] }; }),
      hostApi('/api/market/catalog').catch(function () { return { apps: [] }; }),
      hostApi('/api/apps').catch(function () { return { apps: [] }; }),
    ]);
    hubs = rs[0].hubs || [];
    catalog = rs[1].apps || [];
    apps = rs[2].apps || [];
    // 优先显示已安装：市场视图首次打开且已有已装应用时，默认落在「已安装」Tab（之后跟随用户选择）
    if (!loadedOnce) {
      loadedOnce = true;
      if (apps.length) { tab = 'installed'; sel = null; }
    }
    render();
  } catch (e) {
    $('items').innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>';
  }
}

// 软确认弹窗：页内 modal（替代原生 confirm），Promise<boolean>
var ovCb = null;
function uiConfirm(msg) {
  return new Promise(function (resolve) {
    ovCb = resolve;
    $('ov-msg').textContent = msg;
    $('overlay').classList.remove('hidden');
  });
}
function closeOv(ok) {
  $('overlay').classList.add('hidden');
  var cb = ovCb; ovCb = null;
  if (cb) cb(ok);
}
$('ov-ok').addEventListener('click', function () { closeOv(true); });
$('ov-cancel').addEventListener('click', function () { closeOv(false); });
$('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeOv(false); });
document.addEventListener('keydown', function (e) {
  if (ovCb && e.key === 'Escape') closeOv(false);
});

load();
</script>
</body>
</html>
