<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工作台</title>
<style>
  :root { --bg:var(--bg); --panel:var(--chip); --panel2:var(--chip3); --line:var(--chip4);
          --fg:var(--fg); --dim:var(--muted); --green:var(--ok); --red:var(--danger);
          --yellow:var(--warn); --blue:var(--accent); --purple:var(--purple); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; color: var(--yellow); }
  .sp { flex: 1; }
  .meta { font-size: 11px; color: var(--dim); }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--blue); color: var(--blue); }
  button.primary { background: var(--green); color: var(--bg3); border-color: var(--green); font-weight: 600; }
  button.danger { background: var(--red); color: var(--bg3); border-color: var(--red); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 11px; }

  #wb { flex: 1; overflow: auto; padding: 14px 18px; }
  .wb-sec { margin-bottom: 18px; }
  .wb-sec-title { color: var(--dim); font-size: 12px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px; }
  .wb-sec-title::before { content: ''; width: 3px; height: 13px; background: var(--blue); border-radius: 2px; }
  .wb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .wb-card { display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer;
    transition: border-color .15s; }
  .wb-card:hover { border-color: var(--blue); }
  .wb-ico { font-size: 26px; flex: none; width: 40px; text-align: center; }
  .wb-info { flex: 1; min-width: 0; }
  .wb-name { font-weight: 600; font-size: 13px; }
  .wb-name .v { font-size: 10px; color: var(--dim); margin-left: 6px; font-weight: 400; }
  .wb-desc { font-size: 11px; color: var(--dim); word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wb-acts { display: flex; gap: 6px; flex: none; }
  .wb-func .wb-go { color: var(--dim); font-size: 14px; flex: none; }
  .wb-func:hover .wb-go { color: var(--blue); }
  .wb-empty { color: var(--dim); font-size: 12px; padding: 22px 0; text-align: center;
    border: 1px dashed var(--line); border-radius: 10px; }
  .wb-status { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11.5px;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .wb-status b { color: var(--fg); }
  .toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; display: none; z-index: 12; }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .toast.err { border-color: var(--red); color: var(--red); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 11;
    display: flex; align-items: center; justify-content: center; }
  #overlay.hidden { display: none; }
  .ov-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; width: 440px; max-width: 92vw; max-height: 80vh; overflow: auto; }
  .ov-box h3 { color: var(--yellow); font-size: 14px; margin-bottom: 10px; }
  .ov-row { font-size: 12px; color: var(--dim); margin-bottom: 6px; word-break: break-all; }
  .ov-row b { color: var(--fg); }
  .ov-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>工作台</h1>
  <span id="wb-count" class="meta"></span>
  <span class="sp"></span>
  <button id="to-skills" title="发现 / 安装 / 管理技能">🧩 技能</button>
</header>

<div id="wb">
  <div class="wb-sec">
    <div class="wb-sec-title">我的应用 <span id="wb-appcount" class="meta"></span></div>
    <div id="wb-apps" class="wb-grid"></div>
  </div>
  <div class="wb-sec">
    <div class="wb-sec-title">快捷</div>
    <div id="wb-quick" class="wb-grid"></div>
  </div>
  <div class="wb-status" id="wb-status"></div>
</div>

<div id="toast" class="toast"></div>

<!-- 软确认弹窗（替代原生 confirm） -->
<div id="overlay" class="hidden">
  <div class="ov-box">
    <h3 id="ov-title">确认卸载</h3>
    <div id="ov-msg" class="ov-row"></div>
    <div class="ov-actions">
      <button id="ov-cancel">取消</button>
      <button id="ov-ok" class="danger">确认卸载</button>
    </div>
  </div>
</div>

<script>
var apps = [];
var wbStats = { documents: 0, links: 0, pending: 0, tasks: 0 };

function $(id) { return document.getElementById(id); }
function toast(msg, ok) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2400);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
// 无 icon 字段 → 按权限推断 emoji（llm=智能 / storage=数据 / 默认包）
function appIco(a) {
  if (!a || !a.permissions) return '📦';
  if (a.permissions.indexOf('llm') !== -1) return '🤖';
  if (a.permissions.indexOf('storage') !== -1) return '🗄️';
  return '📦';
}

// ================= 工作台 =================
function renderWorkbench() {
  $('wb-count').textContent = apps.length + ' 个应用';
  var box = $('wb-apps');
  $('wb-appcount').textContent = apps.length + ' 个';
  if (!apps.length) {
    box.innerHTML = '<div class="wb-empty">还没有应用 —— 侧边栏「🧩 技能」发现/安装技能与应用，或终端 <code>/skills import &lt;路径&gt;</code> 导入</div>';
  } else {
    box.innerHTML = apps.map(function (a) {
      return '<div class="wb-card" data-id="' + esc(a.id) + '">' +
        '<div class="wb-ico">' + appIco(a) + '</div>' +
        '<div class="wb-info">' +
        '<div class="wb-name">' + esc(a.name) + '<span class="v">v' + esc(a.version) + '</span></div>' +
        '<div class="wb-desc">' + esc(a.description || a.id) + '</div></div>' +
        '<div class="wb-acts">' +
        '<button class="primary" data-run="' + esc(a.id) + '">运行</button>' +
        '<button class="small" data-uni="' + esc(a.id) + '">卸载</button></div></div>';
    }).join('');
  }
  $('wb-status').innerHTML =
    '文档 <b>' + wbStats.documents + '</b> · 链接 <b>' + wbStats.links + '</b>' +
    ' · 待审 <b style="color:' + (wbStats.pending ? 'var(--yellow)' : 'var(--fg)') + '">' + wbStats.pending + '</b>' +
    ' · 任务 <b>' + wbStats.tasks + '</b>';
  // 快捷入口：任务看板（用户决策：工作台保留任务入口）
  $('wb-quick').innerHTML =
    '<div class="wb-card wb-func" data-cmd="/view board" title="任务看板：目标拆解 · 依赖校验 · 进度跟踪">' +
    '<div class="wb-ico">📋</div>' +
    '<div class="wb-info"><div class="wb-name">任务看板</div><div class="wb-desc">目标拆解 · 依赖校验 · 进度跟踪</div></div>' +
    '<div class="wb-go">→</div></div>';
}
// 工作台事件委托：运行 / 卸载 / 快捷入口
$('wb-apps').addEventListener('click', function (e) {
  var run = e.target.closest('[data-run]');
  var uni = e.target.closest('[data-uni]');
  if (run) { runApp(run.getAttribute('data-run')); return; }
  if (uni) { uninstallApp(uni.getAttribute('data-uni')); return; }
  var card = e.target.closest('.wb-card');
  if (card) runApp(card.getAttribute('data-id'));
});
$('wb-quick').addEventListener('click', function (e) {
  var el = e.target.closest('[data-cmd]');
  if (el) window.parent.postMessage({ type: 'cmd', cmd: el.getAttribute('data-cmd') }, '*');
});
$('to-skills').addEventListener('click', function () {
  window.parent.postMessage({ type: 'cmd', cmd: '/view skills' }, '*');
});

// ---------- 运行 / 卸载 ----------
function runApp(id) {
  window.parent.postMessage({ type: 'cmd', cmd: '/view ' + id }, '*');
}
function uninstallApp(id, name) {
  uiConfirm('确认卸载 ' + name + '（' + id + '）？（应用目录将被删除）').then(function (ok) {
    if (!ok) return;
    hostApi('/api/market/uninstall', { method: 'POST', body: { id: id } }).then(function () {
      toast('✓ 已卸载 ' + id, true);
      return load();
    }).catch(function (e) { toast('卸载失败: ' + e.message, false); });
  });
}

// ---------- 数据加载 ----------
async function load() {
  try {
    var rs = await Promise.all([
      hostApi('/api/apps').catch(function () { return { apps: [] }; }),
      hostApi('/api/graph/stats').catch(function () { return {}; }),
      hostApi('/api/kb/pending').catch(function () { return { pending: [] }; }),
      hostApi('/api/tasks').catch(function () { return { tasks: [] }; }),
    ]);
    apps = rs[0].apps || [];
    var g = rs[1] || {};
    wbStats.documents = g.docs || g.documents || g.nodes || 0;
    wbStats.links = g.links || g.edges || 0;
    wbStats.pending = (rs[2].pending || []).length;
    wbStats.tasks = (rs[3].tasks || []).length;
    renderWorkbench();
  } catch (e) {
    $('wb-apps').innerHTML = '<div class="wb-empty">加载失败: ' + esc(e.message) + '</div>';
  }
}

// 软确认弹窗：页内 modal（替代原生 confirm），Promise<boolean>
var ovCb = null;
function uiConfirm(msg) {
  return new Promise(function (resolve) {
    ovCb = resolve;
    $('ov-msg').textContent = msg;
    $('overlay').classList.remove('hidden');
  });
}
function closeOv(ok) {
  $('overlay').classList.add('hidden');
  var cb = ovCb; ovCb = null;
  if (cb) cb(ok);
}
$('ov-ok').addEventListener('click', function () { closeOv(true); });
$('ov-cancel').addEventListener('click', function () { closeOv(false); });
$('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeOv(false); });
document.addEventListener('keydown', function (e) {
  if (ovCb && e.key === 'Escape') closeOv(false);
});

load();
</script>
</body>
</html>
