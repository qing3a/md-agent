<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知识图谱</title>
<style>
  body { margin: 0; background: var(--bg3); color: var(--fg);
         font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; overflow: hidden; }
  #wrap { display: flex; height: 100vh; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---- 顶栏（精简：标题 + 搜索 + 3 动作） ---- */
  #toolbar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  #toolbar h1 { font-size: 14px; color: var(--rose); margin: 0; }
  #search-wrap { position: relative; flex: 1; min-width: 160px; max-width: 380px; }
  #search { width: 100%; box-sizing: border-box; background: var(--chip2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 30px 6px 10px; font-size: 12px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    color: var(--muted); cursor: pointer; font-size: 13px; background: none; border: none; display: none; }
  #search-clear:hover { color: var(--danger); }
  #search-drop { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); max-height: 260px; overflow: auto; display: none; }
  #search-drop .sd-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    cursor: pointer; font-size: 12px; white-space: nowrap; }
  #search-drop .sd-item:hover, #search-drop .sd-item.sd-sel { background: var(--chip2); }
  #search-drop .sd-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #search-drop .sd-ico { font-size: 12px; flex: none; }
  #search-drop .sd-t { overflow: hidden; text-overflow: ellipsis; }
  #search-drop .sd-p { color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
  .tb-sp { flex: 1; }
  .tbtn { background: var(--border); color: var(--fg); border: none; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .tbtn:hover { background: var(--border2); }
  .tbtn.on { background: var(--accent); color: #fff; }
  #gfilter-orphans, #gfilter-hang { padding: 3px 10px; }

  /* ---- 中部：树抽屉 | 主画布 | 详情抽屉 ---- */
  #mid { flex: 1; min-height: 0; display: flex; }
  /* 左抽屉：文档树（默认开，可关） */
  #tree-drawer { width: 240px; flex: none; display: none; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--bg4); overflow: hidden; }
  body.tree-open #tree-drawer { display: flex; }
  .dw-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    font-size: 12px; font-weight: 600; color: var(--fg2); border-bottom: 1px solid var(--border); }
  .dw-close { margin-left: auto; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; }
  .dw-close:hover { color: var(--danger); }
  #tree { flex: 1; overflow: auto; padding: 8px 10px; box-sizing: border-box; font-size: 12px; }
  /* 主画布（弹性全高，P6 修复） */
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #gp-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 14px 2px; font-size: 12px; }
  #gp-head b { color: var(--accent); }
  #gp-meta { color: var(--muted); font-size: 11px; }
  .gh-sp { flex: 1; }
  .gp-ctl { color: var(--muted); font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
  .gp-ctl input[type=range] { width: 90px; accent-color: var(--accent); }
  .gp-ctl.disabled { opacity: .4; }
  .gbtn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 5px;
    padding: 1px 8px; font-size: 11px; cursor: pointer; }
  .gbtn:hover { border-color: var(--accent); color: var(--accent); }
  #stage canvas { flex: 1; min-height: 0; width: 100%; display: block; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  #gp-hint { flex: none; padding: 3px 14px 6px; font-size: 10.5px; color: var(--muted2, #7f849c); }
  /* 右抽屉：详情情境（选中出现，标签页） */
  #detail-drawer { width: 300px; flex: none; display: none; flex-direction: column;
    border-left: 1px solid var(--border); background: var(--bg4); overflow: hidden; }
  body.detail-open #detail-drawer { display: flex; }
  .dd-tabs { flex: none; display: flex; border-bottom: 1px solid var(--border); }
  .dd-tab { flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-size: 12px; padding: 6px 0; cursor: pointer; }
  .dd-tab:hover { color: var(--fg2); }
  .dd-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .dd-body { flex: 1; overflow: auto; padding: 10px 12px; font-size: 12px; }
  .dd-page { line-height: 1.7; word-break: break-all; }
  .dd-page .p-hint { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; }

  /* 文件树 */
  .dir-line, .file-line { display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .dir-line:hover, .file-line:hover { background: var(--chip2); }
  .dir-line .tw { width: 14px; color: var(--muted); text-align: center; flex: none; }
  .file-line .tw { width: 14px; flex: none; }
  .file-line.sel { background: var(--border); }
  .file-line.hit { outline: 2px solid var(--warn); outline-offset: -1px; }
  .file-line.gp-hov { background: var(--chip2); box-shadow: inset 2px 0 0 var(--accent); }
  .file-line .nm { overflow: hidden; text-overflow: ellipsis; }
  .t-ico { font-size: 12px; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .orphan .nm { color: var(--danger); }
  .orphan .nm::after { content: ' (孤立)'; color: var(--danger); }
  .hang { color: var(--warn); font-size: 10px; }
  .kids { margin-left: 18px; }
  .tree-empty { color: var(--muted); padding: 10px; font-size: 12px; }

  /* 详情页（右抽屉） */
  #dd-info .d-title { font-size: 13px; font-weight: 600; color: var(--rose); margin-bottom: 4px; }
  #dd-info .d-meta { color: var(--dim); font-size: 11.5px; margin-bottom: 6px; }
  .type-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; margin-bottom: 6px; }
  #dd-info .sec { color: var(--muted); margin-top: 8px; font-size: 11px; }
  #dd-info ul { margin: 2px 0 0; padding-left: 16px; }
  #dd-info li { cursor: pointer; }
  #dd-info li:hover { color: var(--accent); }
  .d-btn { background: var(--border); color: var(--fg); border: none; border-radius: 5px;
    padding: 3px 10px; font-size: 11px; cursor: pointer; margin-top: 6px; margin-right: 6px; }
  .d-btn:hover { background: var(--border2); }

  /* 路径探索（右抽屉路径页） */
  #dd-path .e-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; }
  #dd-path .e-row b { color: var(--fg2); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #exp-to { flex: 1; min-width: 0; background: var(--chip2); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; }
  #exp-to:focus { border-color: var(--accent); }
  #exp-sug { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
  .exp-sug-item { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip);
    border: 1px solid var(--border); cursor: pointer; color: var(--fg2); }
  .exp-sug-item:hover { border-color: var(--accent); color: var(--accent); }
  #exp-path { margin-top: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 12px; }
  .path-node { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--border); cursor: pointer; color: var(--fg); }
  .path-node:hover { border-color: var(--accent); }
  .path-node .pn-ico { font-size: 11px; }
  .path-arrow { color: var(--muted); font-size: 11px; }
  #exp-msg { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  #exp-msg.err { color: var(--danger); }

  /* 健康页（右抽屉） */
  #dd-health .h-title { color: var(--muted); margin-bottom: 6px; font-weight: 600; font-size: 12px; }
  #dd-health .h-sec { margin-bottom: 8px; }
  #dd-health .h-sec > div:first-child { color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
  #dd-health .h-sec b { color: var(--warn); }
  #dd-health ul { margin: 0; padding-left: 16px; }
  #dd-health li { cursor: pointer; color: var(--fg2); font-size: 11.5px; }
  #dd-health li:hover { color: var(--accent); }
  #dd-health .h-ok { color: var(--ok); font-size: 11.5px; }

  /* 底部过滤条（图例 chips + 孤立/悬空 + 统计统一沉底） */
  #fbar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 5px 14px; border-top: 1px solid var(--border); background: var(--bg4); font-size: 11px; }
  #stats { color: var(--fg2); font-size: 11.5px; white-space: nowrap; }
  #stats div { display: inline; margin: 0 6px 0 0; }
  .fb-sep { width: 1px; height: 14px; background: var(--border); flex: none; }
  #lg-chips { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .lg-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid transparent; cursor: pointer; color: var(--fg2); background: var(--chip); }
  .lg-chip:hover { border-color: var(--border2); }
  .lg-chip.off { opacity: 0.35; }
  .lg-chip .lg-dot { width: 8px; height: 8px; border-radius: 50%; }
  .lg-chip .lg-ico { font-size: 11px; }
  .lg-chip .lg-n { color: var(--muted); font-size: 10px; }

  #gp-tip { position: fixed; display: none; pointer-events: none; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px;
    color: var(--fg); z-index: 99; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
</style>
</head>
<body class="tree-open">
<div id="gp-tip"></div>
<div id="wrap">
  <div id="main">
    <!-- 顶栏：标题 + 搜索 + 动作 -->
    <div id="toolbar">
      <h1>🕸 知识图谱</h1>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="搜索文档…（命中高亮并聚焦）" autocomplete="off" spellcheck="false">
        <span id="search-clear" title="清除">×</span>
        <div id="search-drop"></div>
      </div>
      <span class="tb-sp"></span>
      <button class="tbtn" id="tree-toggle" title="显示/隐藏文档树">📁 树</button>
      <button class="tbtn" id="full-btn" title="回到全库图谱">⛶ 全图</button>
      <button class="tbtn" id="refresh" title="重新加载图谱">↻</button>
    </div>

    <div id="mid">
      <!-- 左抽屉：文档树 -->
      <div id="tree-drawer">
        <div class="dw-head">📁 文档树<button class="dw-close" id="tree-close" title="收起">×</button></div>
        <div id="tree">加载中…</div>
      </div>

      <!-- 主画布：图即页面主体（弹性全高） -->
      <div id="stage">
        <div id="gp-head">
          <b id="gp-title">全库图谱</b>
          <span id="gp-meta"></span>
          <span class="gh-sp"></span>
          <label class="gp-ctl" id="depth-ctl">深度
            <input type="range" id="gp-depth" min="1" max="6" step="1" value="3" title="局部聚焦时的扩展跳数">
          </label>
          <button class="gbtn" id="gp-fit" title="适配全图">⤢ 适配</button>
          <button class="gbtn" id="gp-zoom-in" title="放大">＋</button>
          <button class="gbtn" id="gp-zoom-out" title="缩小">－</button>
        </div>
        <canvas id="gp-canvas"></canvas>
        <div id="gp-hint">单击聚焦 + 详情 · 双击以节点为中心重布局 · 拖拽固定 · 滚轮缩放 · 悬停高亮邻域 · 路径链橙色</div>
      </div>

      <!-- 右抽屉：详情情境（选中出现，标签页：详情/路径/健康） -->
      <div id="detail-drawer">
        <div class="dw-head">📖 详情<button class="dw-close" id="dd-close" title="收起">×</button></div>
        <div class="dd-tabs">
          <button class="dd-tab on" data-tab="info">详情</button>
          <button class="dd-tab" data-tab="path">路径</button>
          <button class="dd-tab" data-tab="health">健康</button>
        </div>
        <div class="dd-body">
          <div class="dd-page" id="dd-info"></div>
          <div class="dd-page" id="dd-path" style="display:none">
            <div class="e-row"><span>从</span><b id="exp-from">—</b></div>
            <div class="e-row"><span>到</span>
              <input id="exp-to" type="text" placeholder="输入目标文档名…" autocomplete="off" spellcheck="false">
            </div>
            <div id="exp-sug"></div>
            <button class="d-btn" id="exp-go">🔗 查关系</button>
            <div id="exp-path"></div>
            <div id="exp-msg"></div>
          </div>
          <div class="dd-page" id="dd-health" style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- 底部过滤条 -->
    <div id="fbar">
      <span id="stats"></span>
      <span class="fb-sep"></span>
      <span id="lg-chips"></span>
      <span class="fb-sep"></span>
      <button class="tbtn" id="gfilter-orphans" title="只看孤立文档">🕳 孤立</button>
      <button class="tbtn" id="gfilter-hang" title="只看含悬空链接的文档">⚠ 悬空</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  // ================= 类型体系 =================
  var TYPES = {
    case:      { ico: '⚖️', color: '#f38ba8', label: '案件' },
    party:     { ico: '👤', color: '#89b4fa', label: '当事人' },
    evidence:  { ico: '📎', color: '#fab387', label: '证据' },
    timeline:  { ico: '🕐', color: '#94e2d5', label: '时间线' },
    law:       { ico: '📜', color: '#f9e2af', label: '法条判例' },
    candidate: { ico: '👔', color: '#89b4fa', label: '候选人' },
    position:  { ico: '📋', color: '#cba6f7', label: '职位' },
    company:   { ico: '🏢', color: '#a6e3a1', label: '客户公司' },
    comm:      { ico: '💬', color: '#eba0ac', label: '沟通记录' },
    skill:     { ico: '🧩', color: '#cba6f7', label: '技能' },
    memory:    { ico: '🧠', color: '#94e2d5', label: '记忆' },
    rule:      { ico: '📘', color: '#f9e2af', label: '规范' },
    index:     { ico: '📑', color: '#7f849c', label: '索引' },
    note:      { ico: '📝', color: '#a6adc8', label: '笔记' },
    doc:       { ico: '📄', color: '#7f849c', label: '文档' },
    dir:       { ico: '📁', color: '#585b70', label: '目录' },
    tag:       { ico: '#',  color: '#b4befe', label: '标签' },
  };
  function typeMeta(t) { return TYPES[t] || TYPES.doc; }
  function typeIco(t) { return typeMeta(t).ico; }
  function typeColor(t) { return typeMeta(t).color; }
  function typeLabel(t) { return typeMeta(t).label; }

  // 类型过滤状态（legend 点击切换；off = 隐藏该类）
  var typeFilter = {};
  function typeOn(t) { return typeFilter[t] !== false; }

  var state = { nodes: [], edges: [], byPath: {}, sel: null,
    dirNodes: [], tagNodes: [], structEdges: [], tagEdges: [], dirByPath: {}, tagOf: {} };
  var gfilter = { orphans: false, hang: false };
  var searchHits = [];   // 当前搜索命中的 path 集合
  var pendingHighlight = null; // 宿主引用点击早于数据就绪时的缓存（P9 竞态修复）

  function isOrphan(n) { return n.in_degree === 0 && n.out_degree === 0; }
  function hasHang(n) {
    return state.edges.some(function (e) { return e.src === n.path && !e.dst_path; });
  }
  // 统一可见性口径（树/图/健康度共用；dir/tag 只看类型开关，不看孤立/悬空）
  function visFilter(n) {
    if (!typeOn(n.type)) return false;
    if (n.type === 'dir' || n.type === 'tag') return true;
    if (gfilter.orphans && !isOrphan(n)) return false;
    if (gfilter.hang && !hasHang(n)) return false;
    return true;
  }
  // 渲染级过滤：chips/孤立/悬空变化时重算一次隐藏集，gpRender 查 O(1)（不重建图、不丢布局）
  var hiddenSet = {};
  function recomputeHidden() {
    hiddenSet = {};
    state.nodes.forEach(function (n) { if (!visFilter(n)) hiddenSet[n.path] = 1; });
    state.dirNodes.forEach(function (n) { if (!visFilter(n)) hiddenSet[n.path] = 1; });
    state.tagNodes.forEach(function (n) { if (!visFilter(n)) hiddenSet[n.path] = 1; });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ================= 底部过滤条：类型图例 =================
  function renderLegend() {
    var counts = {};
    state.nodes.forEach(function (n) { counts[n.type] = (counts[n.type] || 0) + 1; });
    state.dirNodes.forEach(function (n) { counts[n.type] = (counts[n.type] || 0) + 1; });
    state.tagNodes.forEach(function (n) { counts[n.type] = (counts[n.type] || 0) + 1; });
    var chips = document.getElementById('lg-chips');
    chips.innerHTML = '';
    Object.keys(counts).sort(function (a, b) {
      return (counts[b] - counts[a]) || (a < b ? -1 : 1);
    }).forEach(function (t) {
      var m = typeMeta(t);
      var c = document.createElement('span');
      c.className = 'lg-chip' + (typeOn(t) ? '' : ' off');
      c.innerHTML = '<span class="lg-dot" style="background:' + m.color + '"></span>' +
        '<span class="lg-ico">' + m.ico + '</span>' + m.label + '<span class="lg-n">' + counts[t] + '</span>';
      c.title = '点击切换显示/隐藏「' + m.label + '」';
      c.addEventListener('click', function () {
        typeFilter[t] = typeFilter[t] === false ? undefined : false;
        c.classList.toggle('off', !typeOn(t));
        recomputeHidden();       // 渲染级过滤：图不重建，节点直接隐显
        renderTree();
        renderHealth();
        scheduleGpFrame();
      });
      chips.appendChild(c);
    });
  }

  // ================= 主画布：力导向图 =================
  var gp = { nodes: [], edges: [], center: null, depth: 3, fullMode: true, scale: 1, ox: 0, oy: 0,
    dragging: false, dragStart: null, nodeDrag: null, pathSet: null, hover: null, linkHover: null,
    fixed: {}, anim: null, vel: {}, alpha: 0, _dragMoved: false };
  var FORCE = { linkDist: 78, spring: 0.05, repel: 1100, center: 0.05, damping: 0.82 };
  var gpCanvas = document.getElementById('gp-canvas');
  var gpCtx = gpCanvas.getContext('2d');
  var gpRaf = null;
  var gpTip = document.getElementById('gp-tip');

  function initForces() {
    gp.vel = {};
    gp.nodes.forEach(function (n) { gp.vel[n.path] = { vx: 0, vy: 0 }; });
    gp.alpha = 1;
  }
  function forceTick() {
    if (gp.alpha < 0.03) { gp.alpha = 0; return false; }
    var k = gp.alpha;
    var get = function (p) { return gp.vel[p] || (gp.vel[p] = { vx: 0, vy: 0 }); };
    gp.edges.forEach(function (e) {
      var a = gp.nodes.find(function (n) { return n.path === e.s; });
      var b = gp.nodes.find(function (n) { return n.path === e.t; });
      if (!a || !b) return;
      var dx = b.x - a.x, dy = b.y - a.y;
      var dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      var f = (dist - FORCE.linkDist) * FORCE.spring * k;
      dx /= dist; dy /= dist;
      get(e.s).vx += dx * f; get(e.s).vy += dy * f;
      get(e.t).vx -= dx * f; get(e.t).vy -= dy * f;
    });
    var ns = gp.nodes;
    var pairs = [];
    if (ns.length > 150) {
      for (var i = 0; i < 400; i++) {
        pairs.push([ns[(Math.random() * ns.length) | 0], ns[(Math.random() * ns.length) | 0]]);
      }
    } else {
      for (var i = 0; i < ns.length; i++) for (var j = i + 1; j < ns.length; j++) pairs.push([ns[i], ns[j]]);
    }
    pairs.forEach(function (pr) {
      var a = pr[0], b = pr[1];
      if (a === b) return;

  // ================= 路径探索（右抽屉路径页） =================
  function openExplore(fromPath) {
    showTab('path');
    document.getElementById('exp-from').textContent =
      (state.byPath[fromPath].title || fromPath.split('/').pop()) + ' (' + fromPath + ')';
    document.getElementById('exp-to').value = '';
    document.getElementById('exp-path').innerHTML = '';
    document.getElementById('exp-msg').textContent = '输入目标文档名，或点下方建议';
    renderExpSuggest('');
  }
  function renderExpSuggest(kw) {
    var sug = document.getElementById('exp-sug');
    var q = (kw || '').toLowerCase();
    var candidates = state.nodes.filter(function (n) {
      if (n.path === state.sel) return false;
      if (hiddenSet[n.path]) return false;
      if (!q) return true;
      return (n.title || '').toLowerCase().includes(q) || n.path.toLowerCase().includes(q);
    }).slice(0, 8);
    sug.innerHTML = '';
    candidates.forEach(function (n) {
      var m = typeMeta(n.type);
      var c = document.createElement('span');
      c.className = 'exp-sug-item';
      c.innerHTML = m.ico + ' ' + esc(n.title || n.path.split('/').pop());
      c.title = n.path;
      c.addEventListener('click', function () {
        document.getElementById('exp-to').value = n.path;
        runExplore(n.path);
      });
      sug.appendChild(c);
    });
    if (!candidates.length) sug.innerHTML = '<span style="color:#7f849c;font-size:11px">(无匹配文档)</span>';
  }
  async function runExplore(toPath) {
    var from = state.sel;
    if (!from || !toPath) return;
    var box = document.getElementById('exp-path');
    var msg = document.getElementById('exp-msg');
    box.innerHTML = '<span style="color:#7f849c">查询中…</span>';
    msg.textContent = '';
    try {
      var r = await hostApi('/api/graph/paths?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(toPath) + '&max_depth=6');
      var chain = r.path || [];
      if (!chain.length) {
        box.innerHTML = '';
        msg.className = 'err';
        msg.textContent = '⚠ 6 跳内未找到关联路径（两文档不连通）';
        return;
      }
      msg.className = '';
      msg.textContent = chain.length === 1 ? '（同一文档）' : '最短路径 ' + (chain.length - 1) + ' 跳：';
      box.innerHTML = '';
      chain.forEach(function (n, i) {
        if (i > 0) {
          var ar = document.createElement('span');
          ar.className = 'path-arrow';
          ar.textContent = '→';
          box.appendChild(ar);
        }
        var m = typeMeta(n.type);
        var pn = document.createElement('span');
        pn.className = 'path-node';
        pn.innerHTML = '<span class="pn-ico">' + m.ico + '</span>' + esc(n.title || n.path.split('/').pop());
        pn.title = n.path + '（' + m.label + '）';
        pn.addEventListener('click', function () { selectDoc(n.path); });
        box.appendChild(pn);
      });
      // 图中高亮路径（P7 修复：链长超过局部深度时自动扩深度并补链上节点，整链可高亮）
      if (chain.length > 1) {
        gp.center = from;
        gp.fullMode = false;
        gp.pathSet = null;
        gp.depth = Math.max(parseInt(depthInput.value, 10) || 3, Math.min(chain.length - 1, 6));
        depthInput.value = gp.depth;
        buildLocalGraph();
        // 兜底补链：深度扩展后仍缺的链节点/链边直接加入（BFS 理论上已含，保险）
        var missing = false;
        chain.forEach(function (cn) {
          if (!gp.nodes.some(function (n) { return n.path === cn.path; })) missing = true;
        });
        if (missing) {
          chain.forEach(function (cn) {
            if (!gp.nodes.some(function (n) { return n.path === cn.path; })) {
              gp.nodes.push({ path: cn.path, x: 0, y: 0, hop: 0, conn: 0 });
            }
          });
          for (var i = 0; i < chain.length - 1; i++) {
            var a = chain[i].path, b = chain[i + 1].path;
            if (!gp.edges.some(function (e) { return (e.s === a && e.t === b) || (e.s === b && e.t === a); })) {
              gp.edges.push({ s: a, t: b });
            }
          }
          layoutGp();
        }
        gp.pathSet = chain.map(function (n) { return n.path; });
        syncDepthUI();
        scheduleGpFrame();
      }
    } catch (e) {
      msg.className = 'err';
      msg.textContent = '查询失败: ' + e.message;
    }
  }
  document.getElementById('exp-to').addEventListener('input', function () {
    renderExpSuggest(this.value);
  });
  document.getElementById('exp-to').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') runExplore(this.value.trim());
  });
  document.getElementById('exp-go').addEventListener('click', function () {
    runExplore(document.getElementById('exp-to').value.trim());
  });

  // ================= 健康页（右抽屉） =================
  function renderHealth() {
    var h = document.getElementById('dd-health');
    var danglingEdges = state.edges.filter(function (e) { return !e.dst_path; });
    var orphans = state.nodes.filter(isOrphan);
    var single = state.nodes.filter(function (n) { return (n.in_degree + n.out_degree) === 1; });
    var dup = {};
    state.nodes.forEach(function (n) {
      var t = (n.title || n.path.split('/').pop());
      if (!dup[t]) dup[t] = { count: 0, paths: [] };
      dup[t].count++;
      dup[t].paths.push(n.path);
    });
    var dups = Object.keys(dup).filter(function (t) { return dup[t].count > 1; });
    var html = '<div class="h-title">🩺 结构健康度</div>';
    html += '<div class="h-sec"><div>悬空链接 <b>' + danglingEdges.length + '</b></div>';
    if (!danglingEdges.length) html += '<div class="h-ok">✓ 无</div>';
    else {
      html += '<ul>';
      danglingEdges.slice(0, 10).forEach(function (e) {
        html += '<li data-path="' + esc(e.src).replace(/"/g, '&quot;') + '">' + esc(e.src) + ' → [[?]]</li>';
      });
      if (danglingEdges.length > 10) html += '<li style="color:#7f849c">…共 ' + danglingEdges.length + ' 条</li>';
      html += '</ul>';
    }
    html += '</div>';
    html += '<div class="h-sec"><div>孤立文档 <b style="color:#f38ba8">' + orphans.length + '</b></div>';
    if (!orphans.length) html += '<div class="h-ok">✓ 无</div>';
    else {
      html += '<ul>';
      orphans.slice(0, 10).forEach(function (n) {
        html += '<li data-path="' + esc(n.path).replace(/"/g, '&quot;') + '">' + esc(n.path) + '</li>';
      });
      if (orphans.length > 10) html += '<li style="color:#7f849c">…共 ' + orphans.length + ' 个</li>';
      html += '</ul>';
    }
    html += '</div>';
    html += '<div class="h-sec"><div>单连接 <b>' + single.length + '</b></div>';
    if (!single.length) html += '<div class="h-ok">✓ 无</div>';
    else {
      html += '<ul>';
      single.slice(0, 6).forEach(function (n) {
        html += '<li data-path="' + esc(n.path).replace(/"/g, '&quot;') + '">' + esc(n.path) + '</li>';
      });
      if (single.length > 6) html += '<li style="color:#7f849c">…共 ' + single.length + ' 个</li>';
      html += '</ul>';
    }
    html += '</div>';
    html += '<div class="h-sec"><div>重复标题 <b>' + dups.length + '</b></div>';
    if (!dups.length) html += '<div class="h-ok">✓ 无</div>';
    else {
      dups.slice(0, 6).forEach(function (t) {
        var g = dup[t];
        html += '<div style="margin-top:3px"><b>' + esc(t) + ' ×' + g.count + '</b></div>';
        html += '<ul>' + g.paths.map(function (p) {
          return '<li data-path="' + esc(p).replace(/"/g, '&quot;') + '">' + esc(p) + '</li>';
        }).join('') + '</ul>';
      });
    }
    html += '</div>';
    h.innerHTML = html;
    h.querySelectorAll('li[data-path]').forEach(function (li) {
      li.addEventListener('click', function () { selectDoc(li.dataset.path); });
    });
  }

  // ================= 统计（底条） =================
  function renderStats() {
    var stats = document.getElementById('stats');

    var orphans = state.nodes.filter(isOrphan);

    var filTxt = (gfilter.orphans ? ' · 过滤:孤立' : '') + (gfilter.hang ? ' · 过滤:悬空' : '');
    stats.innerHTML =
      '<div>文档 <b>' + state.nodes.length + '</b> · 链接 <b>' + state.edges.length + '</b>（悬空 ' + dangling + '）</div>' +
      '<div>孤立 <b style="color:#f38ba8">' + orphans.length + '</b> · 单连接 ' + single.length + '</div>' +
      (filTxt ? '<div style="color:#f9e2af">' + filTxt + '</div>' : '');

  // ================= 树（左抽屉） =================
  function selectDoc(path) {
    state.sel = path;
    var n = state.byPath[path];
    if (!n) return;
    var lines = document.querySelectorAll('.file-line');
    for (var i = 0; i < lines.length; i++) {
      lines[i].classList.toggle('sel', lines[i].getAttribute('data-path') === path);
    }
    if (n.type !== 'dir' && n.type !== 'tag') showDetail(path); // 目录/标签只选中不高亮详情
    if (gp.nodes.some(function (x) { return x.path === path; })) {
      gpFocusNode(path);
    }
    var line = document.querySelector('.file-line[data-path="' + path.replace(/"/g, '\\"') + '"]');
    if (line && line.scrollIntoView) line.scrollIntoView({ block: 'nearest' });
  }
  function renderTree() {
    if (gp.linkHover) { gp.linkHover = null; scheduleGpFrame(); }
    var root = {};
    var visible = {};
    state.nodes.forEach(function (n) {
      if (!visFilter(n)) return;
      visible[n.path] = true;
      var parts = n.path.split('/');
      var cur = root;
      for (var i = 0; i < parts.length - 1; i++) {
        cur.dirs = cur.dirs || {};
        cur = cur.dirs[parts[i]] = cur.dirs[parts[i]] || {};
      }
      cur.files = cur.files || [];
      cur.files.push(n);
    });
    var box = document.getElementById('tree');
    box.innerHTML = '';
    function walk(node, container, depth) {
      if (node.dirs) {
        Object.keys(node.dirs).sort().forEach(function (d) {
          var row = document.createElement('div');
          row.className = 'dir-line';
          row.style.paddingLeft = (depth * 18) + 'px';
          var tw = document.createElement('span');
          tw.className = 'tw'; tw.textContent = '▸';
          var nm = document.createElement('span');
          nm.className = 'nm'; nm.textContent = d;
          row.appendChild(tw); row.appendChild(nm);
          var kids = document.createElement('div');
          kids.className = 'kids';
          kids.style.display = 'none';
          row.addEventListener('click', function () {
            var open = kids.style.display !== 'none';
            kids.style.display = open ? 'none' : 'block';
            tw.textContent = open ? '▸' : '▾';
          });
          container.appendChild(row);
          container.appendChild(kids);
          walk(node.dirs[d], kids, depth + 1);
        });
      }
      if (node.files) {
        node.files.sort(function (a, b) { return a.path < b.path ? -1 : 1; });
        node.files.forEach(function (n) {
          var m = typeMeta(n.type);
          var row = document.createElement('div');
          row.className = 'file-line' + (isOrphan(n) ? ' orphan' : '') + (hasHang(n) ? ' hang' : '') +
            (searchHits.indexOf(n.path) !== -1 ? ' hit' : '') + (state.sel === n.path ? ' sel' : '');
          row.dataset.path = n.path;
          row.style.paddingLeft = (depth * 18) + 'px';
          var ic = document.createElement('span');
          ic.className = 't-ico'; ic.textContent = m.ico;
          var dt = document.createElement('span');
          dt.className = 'dot'; dt.style.background = m.color;
          var nm = document.createElement('span');
          nm.className = 'nm';
          nm.textContent = n.title || n.path.split('/').pop();
          nm.title = n.path;
          row.appendChild(ic); row.appendChild(dt); row.appendChild(nm);
          row.addEventListener('click', function () { selectDoc(n.path); });
          row.addEventListener('mouseenter', function () {
            if (gp.linkHover !== n.path) { gp.linkHover = n.path; scheduleGpFrame(); }
          });
          row.addEventListener('mouseleave', function () {
            if (gp.linkHover === n.path) { gp.linkHover = null; scheduleGpFrame(); }
          });
          container.appendChild(row);
        });
      }
      if (!container.children.length && depth === 0) {
        container.innerHTML = '<div class="tree-empty">（过滤后无匹配文档）</div>';
      }
    }
    walk(root, box, 0);
    if (!state.nodes.length) {
      box.innerHTML = '<div class="tree-empty">图谱为空，点击「↻」或终端 /rescan 重建</div>';
    }
  }

  // ================= 搜索 =================
  async function doSearch(q) {
    searchHits = [];
    var hits = [];
    if (q) {
      try {
        var r = await hostApi('/api/search?q=' + encodeURIComponent(q) + '&layer=notes');
        hits = (r.hits || []).map(function (h) { return h.file; });
      } catch (e) { /* 搜索失败静默 */ }
    }
    searchHits = hits;
    renderTree();
    renderSearchDrop(hits);
    if (hits.length) {
      expandToPath(hits[0]);
      selectDoc(hits[0]); // 打开详情抽屉 + 聚焦
    } else {
      closeDetail();
    }
  }
  function expandToPath(path) {
    var box = document.getElementById('tree');
    var kids = box.querySelector('.kids');
    document.querySelectorAll('#tree .dir-line').forEach(function (row) {
      var kidsEl = row.nextElementSibling;
      if (kidsEl && kidsEl.classList.contains('kids')) {
        kidsEl.style.display = 'block';
        var tw = row.querySelector('.tw');
        if (tw) tw.textContent = '▾';
      }
    });
  }
  function renderSearchDrop(hits) {
    var drop = document.getElementById('search-drop');
    drop.innerHTML = '';
    if (!hits.length) { drop.style.display = 'none'; return; }
    hits.slice(0, 10).forEach(function (p, i) {
      var n = state.byPath[p];
      if (!n) return;
      var m = typeMeta(n.type);
      var it = document.createElement('div');
      it.className = 'sd-item' + (i === 0 ? ' sd-sel' : '');
      it.innerHTML = '<span class="sd-dot" style="background:' + m.color + '"></span>' +
        '<span class="sd-ico">' + m.ico + '</span>' +
        '<span class="sd-t">' + esc(n.title || p.split('/').pop()) + '</span>' +
        '<span class="sd-p">' + esc(p) + '</span>';
      it.addEventListener('click', function () {
        selectDoc(p);
        drop.style.display = 'none';
        document.getElementById('search').value = n.title || '';
      });
      drop.appendChild(it);
    });
    drop.style.display = 'block';
  }
  var searchInput = document.getElementById('search');
  var searchTimer = null;
  searchInput.addEventListener('input', function () {
    var q = this.value.trim();
    document.getElementById('search-clear').style.display = q ? 'block' : 'none';
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { doSearch(q); }, 250);
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var sel = document.querySelector('#search-drop .sd-sel');
      if (sel) { sel.click(); e.preventDefault(); }
    }
  });
  document.getElementById('search-clear').addEventListener('click', function () {
    searchInput.value = '';
    this.style.display = 'none';
    doSearch('');
  });

  // ================= 宿主 highlight 通道（P9 竞态修复：数据未就绪时缓存，load 完成后补执行） =================
  window.addEventListener('message', function (ev) {
    var msg = ev.data;
    if (!msg || msg.type !== 'highlight' || !msg.path) return;
    if (!state.byPath[msg.path]) { pendingHighlight = msg.path; return; }
    doHighlight(msg.path);
  });
  function doHighlight(path) {
    expandToPath(path);
    selectDoc(path);
    gp.center = path;
    gp.fullMode = false;
    gp.depth = parseInt(depthInput.value, 10) || 3;
    buildLocalGraph();
    syncDepthUI();
  }

  // ================= 加载 =================
  async function load() {
    var box = document.getElementById('tree');
    box.innerHTML = '<div class="tree-empty">加载中…</div>';
    var g = await hostApi('/api/graph/graph');
    state.nodes = g.nodes;
    state.edges = g.edges;
    state.dirNodes = g.dir_nodes || [];
    state.tagNodes = g.tag_nodes || [];
    state.structEdges = g.structure_edges || [];
    state.tagEdges = g.tag_edges || [];
    state.byPath = {};
    g.nodes.forEach(function (n) { state.byPath[n.path] = n; });
    state.dirByPath = {};
    g.dir_nodes.forEach(function (n) { state.dirByPath[n.path] = n; state.byPath[n.path] = n; });
    state.tagOf = {};
    g.tag_nodes.forEach(function (n) { state.byPath[n.path] = n; state.tagOf[n.path] = []; });
    g.tag_edges.forEach(function (e) { (state.tagOf[e.src] = state.tagOf[e.src] || []).push(e.dst_path); });
    recomputeHidden();
    if (!g.nodes.length) {
      document.getElementById('tree').innerHTML =
        '<div class="tree-empty">图谱为空，点击「↻」或终端执行 /rescan 重建</div>';
      document.getElementById('stats').innerHTML = '<div>文档: 0</div>';
      return;
    }
    renderLegend();
    renderTree();
    renderHealth();
    renderStats();
    // 默认 = 全库图谱 + 树抽屉开（无全屏黑幕；工具栏全部可用）
    gp.fullMode = true;
    buildFullGraph();
    syncDepthUI();
    gpFit();
    // P9：数据就绪后补执行引用高亮
    if (pendingHighlight && state.byPath[pendingHighlight]) {
      var ph = pendingHighlight;
      pendingHighlight = null;
      doHighlight(ph);
    }
  }

  // ================= 底部过滤：孤立/悬空（渲染级，图不重建） =================
  function bindGfilter(btn, key) {
    btn.addEventListener('click', function () {
      gfilter[key] = !gfilter[key];
      this.classList.toggle('on', gfilter[key]);
      recomputeHidden();
      renderTree();
      renderHealth();
      renderStats();
      scheduleGpFrame();
    });
  }
  bindGfilter(document.getElementById('gfilter-orphans'), 'orphans');
  bindGfilter(document.getElementById('gfilter-hang'), 'hang');
  document.getElementById('refresh').addEventListener('click', function () {
    load();
  });

  // 画布尺寸变化（抽屉开合）→ 适配视口
  function onCanvasResize() {
    if (gp.nodes.length) gpFit();
  }
  if (window.ResizeObserver) {
    new ResizeObserver(onCanvasResize).observe(gpCanvas);
  }
  window.addEventListener('resize', onCanvasResize);

  load();
})();
</script>
</body>
</html>
