<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知识库结构导航</title>
<style>
  body { margin: 0; background: #11111b; color: #cdd6f4;
         font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; overflow: hidden; }
  #wrap { display: flex; height: 100vh; }
  #treebox { flex: 1; min-width: 0; overflow: auto; padding: 14px; box-sizing: border-box; }
  #side { width: 300px; padding: 14px; border-left: 1px solid #313244;
          overflow: auto; font-size: 12px; box-sizing: border-box; background: #161622; }
  h1 { font-size: 14px; color: #f5e0dc; margin: 0 0 10px; }
  #stats div { margin: 3px 0; }

  /* 文件树 */
  .dir-line, .file-line { display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .dir-line:hover, .file-line:hover { background: #1e1e30; }
  .dir-line .tw { width: 14px; color: #7f849c; text-align: center; flex: none; }
  .file-line .tw { width: 14px; flex: none; }
  .file-line.sel { background: #313244; }
  .file-line .nm { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.p0 { background: #89b4fa; } .dot.p1 { background: #a6e3a1; }
  .dot.p2 { background: #f9e2af; } .dot.p3 { background: #f38ba8; }
  .dot.p4 { background: #cba6f7; } .dot.p5 { background: #94e2d5; }
  .dot.p6 { background: #fab387; } .dot.p7 { background: #eba0ac; }
  .orphan .nm { color: #f38ba8; }
  .orphan .nm::after { content: ' (孤立)'; color: #f38ba8; }
  .hang { color: #f9e2af; font-size: 10px; }
  .kids { margin-left: 18px; }

  /* 详情 */
  #detail { display: none; background: #181825; border: 1px solid #313244;
            border-radius: 6px; padding: 8px 10px; margin-top: 12px; word-break: break-all; line-height: 1.7; }
  #detail b { color: #f5e0dc; }
  #detail .sec { color: #7f849c; margin-top: 8px; }
  #detail ul { margin: 2px 0 0; padding-left: 16px; }
  #detail li { cursor: pointer; }
  #detail li:hover { color: #89b4fa; }
  #orphans { margin-top: 12px; color: #f38ba8; }
  #orphans ul { margin: 4px 0 0; padding-left: 16px; }
  #orphans li { cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <div id="treebox"><h1>知识库结构导航</h1><div id="tree">加载中…</div></div>
  <div id="side">
    <div id="stats"></div>
    <div id="detail"></div>
    <div id="orphans"></div>
  </div>
</div>
<script>
  var COLORS = ['#89b4fa', '#a6e3a1', '#f9e2af', '#f38ba8', '#cba6f7', '#94e2d5', '#fab387', '#eba0ac'];

  var state = { nodes: [], edges: [], pcolor: {}, byPath: {}, sel: null };

  function nodeColor(p) {
    if (!(p in state.pcolor)) state.pcolor[p] = COLORS[Object.keys(state.pcolor).length % COLORS.length];
    return state.pcolor[p];
  }
  function dotClass(p) {
    var i = COLORS.indexOf(nodeColor(p));
    return 'dot p' + i;
  }

  // 选中文档 → 详情（出链/入链/关联簇）
  async function showDetail(path) {
    var d = document.getElementById('detail');
    var n = state.byPath[path];
    if (!n) { d.style.display = 'none'; return; }
    var orphan = n.in_degree === 0 && n.out_degree === 0;
    d.style.display = 'block';
    d.innerHTML =
      '<b>' + (n.title || path.split('/').pop()) + '</b><br>' +
      '路径: ' + path + '<br>' +
      '项目: ' + n.project + '<br>' +
      '标签: ' + (n.tags || '-') + '<br>' +
      '入链: ' + n.in_degree + ' / 出链: ' + n.out_degree +
      (orphan ? '<br><span style="color:#f38ba8">⚠ 孤立文档：无入链也无出链，可 /link 补链</span>' : '');
    // 出链（含悬空）
    var out = state.edges.filter(function (e) { return e.src === path; });
    if (out.length) {
      d.innerHTML += '<div class="sec">出链 (' + out.length + ')</div><ul>';
      out.forEach(function (e) {
        var li = document.createElement('li');
        if (e.dst_path) {
          li.textContent = e.dst_path;
          li.addEventListener('click', function () { selectDoc(e.dst_path); });
        } else {
          li.innerHTML = '<span style="color:#f9e2af">悬空: [[未知]]</span>';
        }
        d.appendChild(li);
      });
      d.innerHTML += '</ul>';
    }
    // 入链
    var inc = state.edges.filter(function (e) { return e.dst_path === path; });
    if (inc.length) {
      d.innerHTML += '<div class="sec">入链 (' + inc.length + ')</div><ul>';
      inc.forEach(function (e) {
        var li = document.createElement('li');
        li.textContent = e.src;
        li.addEventListener('click', function () { selectDoc(e.src); });
        d.appendChild(li);
      });
      d.innerHTML += '</ul>';
    }
  }

  function selectDoc(path) {
    state.sel = path;
    var lines = document.querySelectorAll('.file-line');
    for (var i = 0; i < lines.length; i++) {
      lines[i].classList.toggle('sel', lines[i].getAttribute('data-path') === path);
    }
    showDetail(path);
  }

  // 渲染文件树（目录层级 → 缩进）
  function renderTree() {
    var root = {};
    state.nodes.forEach(function (n) {
      var parts = n.path.split('/');
      var cur = root;
      for (var i = 0; i < parts.length - 1; i++) {
        cur.dirs = cur.dirs || {};
        cur = cur.dirs[parts[i]] = cur.dirs[parts[i]] || {};
      }
      cur.files = cur.files || [];
      cur.files.push(n);
    });
    var box = document.getElementById('tree');
    box.innerHTML = '';
    function walk(node, container, depth) {
      if (node.dirs) {
        Object.keys(node.dirs).sort().forEach(function (d) {
          var row = document.createElement('div');
          row.className = 'dir-line';
          row.style.paddingLeft = (depth * 18) + 'px';
          var tw = document.createElement('span');
          tw.className = 'tw'; tw.textContent = '▸';
          var nm = document.createElement('span');
          nm.className = 'nm'; nm.textContent = d;
          row.appendChild(tw); row.appendChild(nm);
          var kids = document.createElement('div');
          kids.className = 'kids';
          kids.style.display = 'none';
          row.addEventListener('click', function () {
            var open = kids.style.display !== 'none';
            kids.style.display = open ? 'none' : 'block';
            tw.textContent = open ? '▸' : '▾';
          });
          container.appendChild(row);
          container.appendChild(kids);
          walk(node.dirs[d], kids, depth + 1);
        });
      }
      if (node.files) {
        node.files.sort(function (a, b) { return a.path < b.path ? -1 : 1; });
        node.files.forEach(function (n) {
          var orphan = n.in_degree === 0 && n.out_degree === 0;
          var hang = state.edges.some(function (e) { return e.src === n.path && !e.dst_path; });
          var row = document.createElement('div');
          row.className = 'file-line' + (orphan ? ' orphan' : '');
          row.setAttribute('data-path', n.path);
          row.style.paddingLeft = (depth * 18) + 'px';
          var tw = document.createElement('span');
          tw.className = 'tw';
          var dot = document.createElement('span');
          dot.className = dotClass(n.project);
          var nm = document.createElement('span');
          nm.className = 'nm';
          nm.textContent = (n.title || n.path.split('/').pop()) + '.md';
          row.appendChild(tw); row.appendChild(dot); row.appendChild(nm);
          if (hang) {
            var h = document.createElement('span');
            h.className = 'hang'; h.textContent = '⚠悬空';
            row.appendChild(h);
          }
          row.addEventListener('click', function () { selectDoc(n.path); });
          container.appendChild(row);
        });
      }
    }
    walk(root, box, 0);
    // 统计
    var stats = document.getElementById('stats');
    var dangling = state.edges.length - state.edges.filter(function (e) { return e.dst_path; }).length;
    stats.innerHTML =
      '<div>文档: <b>' + state.nodes.length + '</b></div>' +
      '<div>链接: <b>' + state.edges.length + '</b>（悬空 ' + dangling + '）</div>' +
      '<div style="margin-top:6px;color:#7f849c">点击左侧文档查看出链/入链</div>';
    // 孤立列表
    var orphans = state.nodes.filter(function (n) { return n.in_degree === 0 && n.out_degree === 0; });
    var ol = document.getElementById('orphans');
    ol.innerHTML = '';
    if (orphans.length) {
      ol.innerHTML = '<div><b>孤立文档 (' + orphans.length + ')</b></div><ul>';
      orphans.forEach(function (n) {
        var li = document.createElement('li');
        li.textContent = n.path;
        li.addEventListener('click', function () { selectDoc(n.path); });
        ol.appendChild(li);
      });
      ol.innerHTML += '</ul>';
    }
  }

  async function main() {
    var g = await hostApi('/api/graph/graph');
    state.nodes = g.nodes;
    state.edges = g.edges;
    state.byPath = {};
    g.nodes.forEach(function (n) { state.byPath[n.path] = n; });
    if (!g.nodes.length) {
      document.getElementById('tree').innerHTML =
        '<div style="color:#f38ba8">图谱为空，终端执行 /rescan 重建</div>';
      document.getElementById('stats').innerHTML = '<div>文档: 0</div>';
      return;
    }
    renderTree();
  }

  main().catch(function (e) {
    document.getElementById('stats').innerHTML =
      '<div style="color:#f38ba8">加载失败: ' + e.message + '</div>';
  });
</script>
</body>
</html>
